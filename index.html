const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));const card=(t,x)=>'<section class="card"><h3>'+t+'</h3>'+x+'</section>';

function washCandidates(role,root){

 if(!Number.isFinite(value))return '';

 const percentage=/^(atk|def|hit|rating|dodge|parry|speed|hp|hp_n|hp_max|po_parry|po_dodge|dmg_off|dmg_ref|cure_sj|kang_debuff|blood|map_move|weapon_add)$/.test(type);

 const number=Number(magnitude.toFixed(2));
 // 원문이 이미 %를 붙이는 경우 기호를 중복하지 않는다.
 return (value<0?'−':'')+number+(percentage&&!explicitPercent?'%':'');
}

function wikiDescription(x,ko){
 const rawTranslation=ko.get(x.key)?.desc||'';
 const translated=wikiCleanDescription(ko.get(x.key)?.source==='한국판 V6.20'?wikiV620Description(x.id,rawTranslation):rawTranslation).trim();
 if(translated&&!wikiHasChinese(translated))return translated;
 const original=wikiCleanDescription(x.obj.desc||'').trim();
 if(original&&!wikiHasChinese(original))return original;
 if(x.source==='buff'){
  if((window.NANGMAN_V620_BUFF_KO||{})[x.id]||Array.isArray(x.obj.fx))return '상태 효과는 아래에 표시된 원본 수치 데이터를 참고하세요.';
 }
 return '한국판 설명 미확보';
}
function wikiImage(x){
 if(!x)return '';
 const o=x.obj;
 // Match yy-sim's actual icon helpers: yr() item, vf() equipment, tb() status
 const base='https://yy-sim.pages.dev/icons/';
 let folder='item',icon=Number(o.icon||o.id)||9999;
 if(x.source==='equips'){folder='equip';icon=Number(o.icon||o.id)||9999}
 if(x.source==='martial'){folder='item';icon=Number(o.pic||1000)||1000}
 if(x.source==='crafts'||x.source==='arts'){
   // 기예·비기는 yy-sim 원본 데이터의 이미지 식별자를 우선 사용한다.
   // 비어 있거나 유효하지 않은 ID를 임의의 다른 아이콘으로 대체하지 않는다.
   const raw=o.icon??o.pic??o.img??o.image??o.iconId??o.icon_id??o.id;
   const token=String(raw??'').split('/').pop().replace(/\.png$/i,'');
   folder='item';icon=/^\d+$/.test(token)&&Number(token)>0?Number(token):9999;
 }
 if(x.cat==='buff'){
   folder='buff';icon=String((window.NANGMAN_V620_BUFF_KO||{})[String(o.id)]?.[2]||(window.NANGMAN_54506_BUFF_KO||{})[String(o.id)]?.[2]||o.icon||'icon_buff_empty').split('/').pop().replace(/\.png$/i,'');
   if(!/^[a-zA-Z0-9_-]+$/.test(icon))icon='icon_buff_empty';
 }
 return base+folder+'/'+icon+'.png';
}
function wikiImgTag(x,large=false){
 const fallback='https://yy-sim.pages.dev/icons/item/9999.png';
 return '<img class="wiki-art '+(large?'large':'')+'" loading="lazy" alt="" src="'+escape(wikiImage(x))+'" onerror="if(!this.dataset.fallback){this.dataset.fallback=1;this.src=\''+fallback+'\'}else this.style.opacity=\'.24\'">';
}
function wikiEffectDescription(x){
 if(x.source!=='buff')return '';
 const names={atk:'공격력',def:'방어력',hit:'명중',rating:'명중률',dodge:'회피',parry:'초식방어',speed:'속도',hp:'기혈',hp_max:'최대 기혈',hp_n:'현재 기혈',hp_back:'기혈 회복',mp:'내력',mp_n:'현재 내력',mp_back:'기 모으기',po_dodge:'회피 무시',po_parry:'초식방어 무시',dmg_off:'피해면역',dmg_ref:'피해 반사',dun:'보호막',renxing:'인내',cure_sj:'받는 치료',kang_debuff:'상태이상 저항',map_move:'이동 속도',weapon_add:'무기 피해',blood:'흡혈',hpdun:'기혈 보호막'};
 const korean=(window.NANGMAN_V620_BUFF_KO||{})[String(x.id)];
 let pairs=[];
 if(korean&&korean[3]){
  const meta=korean[3];
  for(let i=1;i<=12;i++){
   const key=meta['buff_type_'+i],value=meta['buff_fudu_'+i];
   if(key!=null&&value!=null)pairs.push([key,value]);
  }
 }
 if(!pairs.length&&Array.isArray(x.obj.fx))pairs=x.obj.fx;
 const percent=key=>/^(atk|def|hit|rating|dodge|parry|speed|hp|hp_max|hp_n|po_dodge|po_parry|dmg_off|dmg_ref|kang_debuff|cure_sj|map_move|weapon_add|blood)$/.test(key);
 const parts=pairs.map(([key,value])=>{
  const n=Number(value),label=names[key];
  if(!label||!Number.isFinite(n)||Math.abs(n)>100000)return '';
  const ratio=percent(String(key));
  let unit='원본 계수',num=Math.abs(n);
  if(ratio){unit='%';num=num*100}
  else if(key==='mp_back'){unit='칸';if(Math.abs(num-Math.round(num))===0.01)num=Math.round(num)}
  else if(key==='hp_back'&&num>1){unit=''}
  else if(key==='renxing'&&num>1){unit=''}
  else if(key==='dun'||key==='hpdun'){unit='%';num=num*100}
  const number=Number(num.toFixed(2));
  return label+' '+(n<0?'−':'+')+number+(unit==='원본 계수'?' (원본 계수)':unit);
 }).filter(Boolean);
 return parts.length?'<div class="wiki-effects"><strong>'+(korean?'한국판 V6.20 효과 데이터':'원본 상태 효과 데이터')+'</strong><p>'+escape(parts.join(' · '))+'</p></div>':'';
}
function wikiFormatField(key,v){
 const labels={lv:'요구 레벨',grade:'등급',type:'종류',cat:'분류',kind:'무학 유형',clan:'문파',atk:'공격',parry:'방어·막기',prop:'내공 속성',fx:'효과',kf:'연결 무학',suoshu:'소속'};
 if(!Object.prototype.hasOwnProperty.call(labels,key)||v==null||typeof v==='object')return '';
 const value=String(v).trim();
 if(!value||wikiHasChinese(value))return '';
 return '<div class="wiki-field"><span>'+escape(labels[key])+'</span><b>'+escape(value)+'</b></div>';
}

function marketCatalogName(row,ko){
 if(!row||row.unmapped)return '상품 ID #'+String(row?.id??'미확인');
 const itemId=String(row.item??'');
 const saved=ko.get('items:'+itemId)?.name;
 if(saved&&!wikiHasChinese(saved))return saved;
 const local=Array.isArray(window.NANGMAN_V620_ITEM_KO?.[itemId])?window.NANGMAN_V620_ITEM_KO[itemId][0]:null;
 if(local&&!wikiHasChinese(local))return String(local);
 return '아이템 #'+itemId+' (상품 #'+row.id+')';
}
function marketItemTable(items,ko,mode='list'){
 if(!items?.length)return '<p class="micro">해당 상품 기록이 없습니다.</p>';
 return '<div class="market-products">'+items.map((x,i)=>{
  const sold=mode==='current'&&x.buyed===1;
  return '<div class="market-product"><span class="market-slot">'+(i+1)+'</span>'+
   '<div class="market-product-details"><b>'+escape(marketCatalogName(x,ko))+'</b><small>상품 #'+escape(x.id)+' · 아이템 #'+escape(x.item||'미연결')+
    (x.count?' · '+escape(x.count)+'개':'')+'</small></div>'+
   '<div class="market-product-price">'+(x.price?Number(x.price).toLocaleString('ko-KR')+' '+(x.money===2?'원보':'은전'):'가격 미확인')+
    (sold?'<small>구매 기록</small>':'')+'</div></div>';
 }).join('')+'</div>';

function marketDate(ts){
 if(!Number.isFinite(ts)||ts<=0)return '기록 없음';
 return new Date(ts*1000).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function characterLifeEffectSummary(record,raw){
 const cfg=(window.LIFE_HEDAO_DATA?.skills||{})[String(record.ID)];
 if(!cfg)return '효과 데이터 미연결';
 const level=Math.max(0,Number(record.Level)||0),menpai=Number(raw?.MenPai);
 let rows=cfg.effects||[];
 if(cfg.mp_sk!=null&&menpai!==Number(cfg.mp_sk)){
  rows=cfg.slots?.length?cfg.slots.map(x=>x.pan||x.effect).filter(Boolean):cfg.panEffects?.length?cfg.panEffects:rows;
 }
 if(!rows.length)return '원본 효과 수치 없음';
 const known=[],other=[];
 for(const row of rows){
  if(!Array.isArray(row)||row.length<3)continue;
  const key=String(row[0]),step=Number(row[1]),value=Number(row[2]);
  if(!Number.isFinite(step)||step<=0||!Number.isFinite(value))continue;
  const stages=Math.floor(level/step);
  if(!stages)continue;
  const amount=stages*value,label=characterLifeEffectNames[key];
  if(!label){other.push(key);continue}
  const isRate=Math.abs(value)<1;
  known.push(label+' +'+(isRate?Number((amount*100).toFixed(2))+'%':Number(amount.toFixed(2))));
 }
 return known.join(' · ')+(other.length?(known.length?' · ':'')+'기타 효과 '+other.length+'종':'')||'현재 레벨에서 활성 효과 없음';
}

function characterEquipSourceStats(raw){
 const gear=characterEntries(raw?.Equips).filter(e=>e&&typeof e==='object'&&Number(e.ID)>0);
 const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
 const list=v=>characterEntries(v).filter(x=>x&&typeof x==='object');
 const affixes=e=>{
  const regular=['EnMans','EnExts','EnSpecials','exts'].flatMap(k=>list(e[k])).map(x=>({
   key:String(x.Key??x.prop??x.key??''),value:n(x.Value??x.value)
  })).filter(x=>x.key);
  const story=list(e.EnStroys).filter(x=>typeof x.Buff==='string'&&x.Buff)
   .map(x=>({key:x.Buff,value:n(x.Type)}));
  return regular.concat(story);
 };
 const scaled=(e,field)=>Math.floor(n(e[field])*(1+n(e.LvProp)/1000));
 const byKeys=(e,keys)=>affixes(e).reduce((sum,x)=>sum+(keys.includes(x.key)?x.value:0),0);
 const definitions=[
  ['기혈','Hp',['hp_add','hp']],['방어','Def',['def_add','def']],
  ['회피','Dodge',['dodge_add','dodge']],['초식방어','Parry',['parry_add','parry']],
  ['속도','Speed',['speed_add','speed']],['인내','RenXing',['renxing']]
 ];
 const results=definitions.map(([label,key,keys])=>({
  label,base:gear.reduce((sum,e)=>sum+scaled(e,key),0),
  affix:gear.reduce((sum,e)=>sum+byKeys(e,keys),0)
 }));
 results.push({label:'강기',base:gear.reduce((sum,e)=>sum+n(e.Gangqi)+n(e.ExtraGangqi),0),
  affix:gear.reduce((sum,e)=>sum+byKeys(e,['gangqi','gq_base']),0)});
 results.push({label:'내경',base:gear.reduce((sum,e)=>sum+n(e.Neijin)+n(e.ExtraNeij),0),
  affix:gear.reduce((sum,e)=>sum+byKeys(e,['neij','neijin']),0)});
 return results;
}
function characterEquipCombatSplit(raw){
 // yy-sim wb() separates weapon types 1..4 from other equipment for ATK/HIT.
 const data=window.EQUIP_DATA||{},lookup={...(data.equipment||{}),...(data.fashion||{})};
 const n=value=>{const x=Number(value);return Number.isFinite(x)?x:0};
 const list=value=>characterEntries(value).filter(x=>x&&typeof x==='object');
 const options=e=>['EnMans','EnExts','EnSpecials','exts'].flatMap(k=>list(e[k])).map(x=>({
  prop:String(x.Key??x.prop??x.key??''),value:n(x.Value??x.value)
 })).concat(list(e.EnStroys).filter(x=>typeof x.Buff==='string').map(x=>({prop:x.Buff,value:n(x.Type)})));
 const weighted=(e,field,names)=>{
  const raw=Math.floor(n(e[field])*(1+n(e.LvProp)/1000));
  const affix=options(e).reduce((v,x)=>v+(names.includes(x.prop)?x.value:0),0);
  return {raw,affix,total:raw+affix};
 };
 const rows=list(raw?.Equips).filter(e=>Number(e.ID)>0).map(e=>{
  const meta=lookup[String(e.ID)],type=Number(meta?.type);
  const kind=!meta||!Number.isFinite(type)?'미분류':type>=1&&type<=4?'무기':'비무기';
  return {id:e.ID,type:kind,sourceType:Number.isFinite(type)?type:null,atk:weighted(e,'Atk',['atk_add','atk']),hit:weighted(e,'Hit',['hit_add','hit'])};
 });
 // Original wb(): weapon HIT counts only active weapon type or type=1 (unarmed).
 // ATK still counts all equipped weapons; subtype relevance is not identical.
 const active=characterEntries(raw?.Taolus).find(x=>x?.Active===true);
 const activeType=Number((window.KONGFU_DATA?.taolu||{})[String(active?.ID)]?.type);
 const hasActiveType=[1,2,3,4].includes(activeType);
 const eligible=e=>!hasActiveType||e.sourceType===1||e.sourceType===activeType;
 const totals=kind=>rows.filter(x=>x.type===kind).reduce((sum,x)=>({
  atk:sum.atk+x.atk.total,hit:sum.hit+(kind==='무기'&&!eligible(x)?0:x.hit.total)
 }),{atk:0,hit:0});
 const excludedWeaponHit=rows.filter(x=>x.type==='무기'&&hasActiveType&&!eligible(x));
 const rawWeaponHit=rows.filter(x=>x.type==='무기').reduce((sum,x)=>sum+x.hit.total,0);
 const weaponKey={1:'unarmed_add',2:'blade_add',3:'sword_add',4:'stick_add'}[activeType]||null;
 const gear=characterEntries(raw?.Equips).filter(x=>x&&Number(x.ID)>0);
 const weaponBonus=weaponKey?gear.reduce((sum,e)=>sum+options(e)
  .reduce((value,x)=>value+(x.prop===weaponKey?x.value:0),0),0):null;
 const bornId=raw?.BornTalent?.ID;
 const born=bornId==null?null:(window.BORN_TALENT_DATA||{})[String(bornId)]||null;
 const bornWeaponPct=born? (Array.isArray(born.effects)?born.effects:[])
  .reduce((sum,e)=>sum+(Array.isArray(e)&&e[0]==='weapon'&&Number.isFinite(Number(e[1]))?Number(e[1]):0),0):null;
 const bornWeaponAtk=bornWeaponPct===null?null:Math.floor(totals('무기').atk*bornWeaponPct);
 return {rows,weapon:totals('무기'),other:totals('비무기'),
  activeType:hasActiveType?activeType:null,weaponKey,weaponBonus,bornWeaponPct,bornWeaponAtk,
  rawWeaponHit,excludedWeaponHit,weaponHitEligibilityKnown:hasActiveType,
  unknown:rows.filter(x=>x.type==='미분류'),complete:rows.every(x=>x.type!=='미분류')};
}

const sanbujinCultivationKinds=[
 ['권법',1,'Taolus','jlgcc_'],['도법',2,'Taolus',null],['검법',3,'Taolus','jwgjz_'],
 ['창·곤',4,'Taolus',null],['내공','ng','Neis',null],['경공','qg','Qings',null]

function characterSanbujinCultivation(root,raw,role){
 const db=window.NANGMAN_SANBUJIN_KONGFU;
 const id=String(role.id),fmt=n=>n===null?'—':String(n);
 const nameMap=wikiKoMap();
 const skillName=skillId=>{
  const known=nameMap.get('martial:'+String(skillId));
  return known&&known.name&&!wikiHasChinese(known.name)?known.name:'#'+String(skillId);
 };
 const entries=sanbujinCultivationKinds.map(([name,kind,source,fixedKey])=>{
  const value=raw['WXXW'+kind];
  const extra=value==null||value===''||!Number.isFinite(Number(value))?null:Number(value);
  const fixed=fixedKey?characterGlobalNumber(root,fixedKey+id):0;
  const transferable=extra===null||fixed===null?null:Math.max(0,extra-fixed);
  const list=Array.isArray(raw[source])?raw[source]:raw[source]&&typeof raw[source]==='object'?Object.values(raw[source]):null;
  let unknown=0;
  const skills=[];
  if(list)for(const record of list){
   if(!record||typeof record!=='object'){unknown++;continue}
   const table=source==='Taolus'?'taolu':source==='Neis'?'nei':'qing';
   const cfg=db?.[table]?.[String(record.ID)];
   const copiedId=source==='Taolus'?Number(record.CopyID||0):0;
   const copied=Number.isFinite(copiedId)&&copiedId>0;
   const actual=copied?db?.taolu?.[String(copiedId)]:cfg;
   if(source==='Taolus'){
    if(!actual||!Number.isFinite(Number(actual.type))){unknown++;continue}
    if(Number(actual.type)!==Number(kind))continue;
   }
   const chong=Number(record.Chong),level=Number(record.Level),grade=Number(actual?.grade);
   const rateRow=db?.rate?.[String((chong-1)*4+level+1)];
   const rate=rateRow?.['kf_'+Math.min(5,Math.max(1,grade))];
   const current=!actual||!Number.isFinite(chong)||!Number.isFinite(level)||!Number.isFinite(grade)||!Number.isFinite(Number(rate))?null:Math.floor(Number(actual.wxxw||0)*Math.min(Number(rate),1));
   if(current===null)unknown++;
   skills.push({id:record.ID,copiedId:copied?copiedId:null,current});
  }
  const learned=list&&db&&unknown===0?skills.reduce((sum,x)=>sum+x.current,0):null;
  const rawTotal=learned===null||extra===null?null:learned+extra;
  const current=rawTotal===null?null:Math.min(1500,rawTotal);
  return {name,kind,extra,fixed,transferable,learned,current,overflow:rawTotal===null?null:Math.max(0,rawTotal-1500),unknown,skills};
 });
 const sum=key=>entries.every(e=>e[key]!==null)?entries.reduce((n,e)=>n+e[key],0):null;
 const total=sum('current'),available=sum('transferable');
 return '<section class="card"><h3>무학 수련치 · 6계열</h3><p class="micro">산부진 원본 무학 882개 및 수련 비율표를 이용합니다. 각 계열의 현재 적용 상한은 1500점이며 검왕각·극락곡 대련은 전환에서 제외합니다. 판별 불가능한 무학은 수치를 추정하지 않습니다.</p>'+
 '<div class="wiki-detail-fields"><div class="wiki-field"><span>현재 총수련치</span><b>'+fmt(total)+'</b></div><div class="wiki-field"><span>전환 가능한 추가 수련치</span><b>'+fmt(available)+'</b></div></div>'+
 '<table class="module-table"><thead><tr><th>계열</th><th>무학</th><th>추가 잔액</th><th>적용 / 1500</th><th>전환 가능</th></tr></thead><tbody>'+
 entries.map(x=>'<tr><td>'+escape(x.name)+'</td><td>'+fmt(x.learned)+'</td><td>'+fmt(x.extra)+'</td><td>'+fmt(x.current)+(x.overflow>0?' (초과 '+x.overflow+')':'')+'</td><td>'+fmt(x.transferable)+'</td></tr>').join('')+
 '</tbody></table>'+
 entries.map(x=>'<details><summary>'+escape(x.name)+' · 학습 무학 '+x.skills.length+'개'+(x.unknown?' · 미판별 '+x.unknown+'개':'')+'</summary>'+
 (x.skills.length?'<table class="module-table"><thead><tr><th>무학</th><th>복사 무학</th><th>수련치</th></tr></thead><tbody>'+x.skills.map(k=>'<tr><td>'+escape(skillName(k.id))+' <small>#'+escape(k.id)+'</small></td><td>'+(k.copiedId?escape(skillName(k.copiedId))+' <small>#'+escape(k.copiedId)+'</small>':'—')+'</td><td>'+fmt(k.current)+'</td></tr>').join('')+'</tbody></table>':'<p class="micro">기록된 무학이 없습니다.</p>')+'</details>').join('')+
 '<p class="micro">전환 시 받는 인물의 잔여 수련 상한도 적용됩니다. 원본 무학 자료가 없거나 불완전하면 계산 대신 — 표시합니다.</p></section>';
}

function yyRoleBaseAptitudes(raw){
 // yy-sim original lb() + m0(): allocation overflow decay and aptitude gift coefficient.
 const n=(key)=>{const x=Number(raw?.[key]??0);return Number.isFinite(x)?x:0};
 const level=n('Level');
 return [['팔힘','Str'],['근골','Con'],['신법','Dex'],['내식','Int']].map(([label,key])=>{
  const assigned=n(key),born=n('Born'+key),gift=n(key+'Gift'),overflow=n('YiChu'+key);
  const cap=level+overflow,excess=Math.max(0,assigned-cap);
  const adjusted=excess?cap+(1-1.2*excess/(100+excess))*excess:assigned;
  const base=Math.floor((adjusted+born)*(1+0.00006*gift));
  return {label,key,assigned,born,gift,cap,adjusted:Number(adjusted.toFixed(6)),base};
 });
}

// Exact yy-sim u0()/Od() cultivation effect path, independent of sanbujin transfer rules.
// This is a pre-final combat cultivation multiplier, not the full character result.
function yyOriginalCultivationEffects(raw){
 const data=window.KONGFU_DATA||{},factors=[
  ['1','권법','QuanGift'],['2','도법','DaoGift'],
  ['3','검법','JianGift'],['4','창·곤','GunGift'],
  ['ng','내공','NGGift'],['qg','경공','QGGift']
 ];
 const list=v=>characterEntries(v).filter(x=>x&&typeof x==='object'&&Number(x.ID)>0);
 const points=(cfg,record)=>{
  if(!cfg||!(Number(cfg.wxxw)>0))return cfg?0:null;
  const chong=Number(record.Chong),level=Number(record.Level);
  const grade=Number(cfg.grade);
  if(!Number.isFinite(chong)||!Number.isFinite(level)||!Number.isFinite(grade))return null;
  const index=(chong-1)*4+level+1;
  const row=data.rate?.[String(index)],rate=row?.['kf_'+Math.min(5,Math.max(1,grade))];
  if(rate===undefined||!Number.isFinite(Number(rate)))return null;
  return Math.floor(Number(cfg.wxxw)*Math.min(Number(rate),1));
 };
 return factors.map(([id,label,giftKey])=>{
  const savedValue=raw?.['WXXW'+id],saved=savedValue==null?0:Number(savedValue);
  const kind=id==='ng'?'nei':id==='qg'?'qing':'taolu';
  const learned=list(raw?.[kind==='taolu'?'Taolus':kind==='nei'?'Neis':'Qings'])
   .filter(x=>kind!=='taolu'||Number(data.taolu?.[String(x.ID)]?.type)===Number(id));
  let pointsSum=0,unknown=0;
  for(const item of learned){const value=points(data[kind]?.[String(item.ID)],item);if(value===null)unknown++;else pointsSum+=value}
  const giftValue=raw?.[giftKey],gift=giftValue==null?1:Number(giftValue);
  const valid=Number.isFinite(saved)&&Number.isFinite(gift)&&unknown===0;
  const current=valid?Math.min(saved+pointsSum,1500):null;
  const bonusPct=valid?current*.025*gift:null;
  return {id,label,saved,learned:unknown?null:pointsSum,unknown,count:learned.length,
   gift:giftValue==null?1:gift,current,bonusPct,
   mpBack:id==='ng'&&current!==null?Math.floor(current/1000):null};
 });
}

// Account-wide read-only overview: role cultivation and permanent growth, shared values counted once.
function yyRoleCultivationModel(role){
 const kinds=[['1','권법'],['2','도법'],['3','검법'],['4','창·곤'],['ng','내공'],['qg','경공']];
 const raw=role?.raw||{},api=window.RoleStatusData;
 let checked=null;
 if(api&&typeof api.cultivation==='function')try{
  checked=api.cultivation(save,raw,role.type==='주인공'?'主角':'随从')?.cultivation;
 }catch(err){checked=null}
 const records=kinds.map(([id,name])=>{
  const extra=Number(raw['WXXW'+id]);
  const matched=checked?.records?.find(x=>String(x.kind)===id);
  const known=Number.isFinite(extra),current=matched?.current,transfer=matched?.transferable;
  return {id,name,extra:known?extra:null,
    current:Number.isFinite(current)?current:null,
    learned:Number.isFinite(matched?.learned)?matched.learned:null,
    transferable:Number.isFinite(transfer)?transfer:null,
    fixed:Number.isFinite(matched?.fixed)?matched.fixed:null,
    raw:Number.isFinite(matched?.raw)?matched.raw:null,
    overflow:Number.isFinite(matched?.overflow)?matched.overflow:null,
    history:(matched?.history||[]).filter(x=>Number.isFinite(x.current)&&x.current>0).map(x=>({
     name:String(x.name).replace('恒山教习','항산파 교습').replace('紫阳书院指点','자양서원 지도'),
     value:x.current
    })),
    unknown:matched?.unknownSkills?.length||0,
    unknownSkills:Array.isArray(matched?.unknownSkills)?matched.unknownSkills.map(String):[],
    skills:Array.isArray(matched?.skills)?matched.skills.map(k=>({id:k.id,copyId:Number(k.copyId)||0,level:k.level,chong:k.chong,current:Number.isFinite(k.current)?k.current:null,copiedName:k.copiedName||''})):[]};
 });
 return {records,total:records.every(x=>x.current!==null)?records.reduce((v,x)=>v+x.current,0):null,
   savedExtra:records.every(x=>x.extra!==null)?records.reduce((v,x)=>v+x.extra,0):null,
   transferable:records.every(x=>x.transferable!==null)?records.reduce((v,x)=>v+x.transferable,0):null};
}
// 독립 교차 검사: 산부진의 수련 함수 호출 없이 동일 단계표로 무학 기여분을 다시 계산한다.
// 클라이언트 원본 수치 자체의 검증이 아니라 코드/매핑 오류 탐지용이다.
function yyIndependentCultivation(role){
 const raw=role?.raw||{},data=window.KONGFU_DATA||{};
 const kinds=[['1','Taolus','taolu',1],['2','Taolus','taolu',2],
  ['3','Taolus','taolu',3],['4','Taolus','taolu',4],
  ['ng','Neis','nei',null],['qg','Qings','qing',null]];
 return kinds.map(([id,field,sourceKind,weaponType])=>{
  const rows=characterEntries(raw[field]).filter(x=>x&&Number(x.ID)>0);
  let sum=0,recognized=0,unknown=0,details=[];
  for(const row of rows){
   const base=data[sourceKind]?.[String(row.ID)];
   const copyId=sourceKind==='taolu'?Number(row.CopyID||0):0;
   const cfg=copyId>0?data.taolu?.[String(copyId)]:base;
   // 복제 무학의 계열은 복제 원본의 종류를 따른다.
   if(sourceKind==='taolu'&&cfg&&Number(cfg.type)!==weaponType)continue;
   if(!cfg||sourceKind==='taolu'&&!Number.isFinite(Number(cfg.type))){unknown++;details.push({id:row.ID,copyId,value:null});continue}
   const chong=Number(row.Chong),level=Number(row.Level),grade=Number(cfg.grade),baseValue=Number(cfg.wxxw??0);
   const index=(chong-1)*4+level+1;
   const rate=data.rate?.[String(index)]?.['kf_'+Math.min(5,Math.max(1,grade))];
   if(!Number.isFinite(chong)||!Number.isFinite(level)||!Number.isFinite(grade)||
      !Number.isFinite(baseValue)||rate===undefined||!Number.isFinite(Number(rate))){
    unknown++;details.push({id:row.ID,copyId,value:null});continue
   }
   const value=Math.floor(baseValue*Math.min(Number(rate),1));
   sum+=value;recognized++;details.push({id:row.ID,copyId,value});
  }
  const extraValue=raw['WXXW'+id],extra=extraValue==null?null:Number(extraValue);
  return {id,learned:unknown===0?sum:null,recognized,unknown,details,
   extra:extra!==null&&Number.isFinite(extra)?extra:null,
   current:unknown===0&&extra!==null&&Number.isFinite(extra)?Math.min(1500,extra+sum):null};
 });
}
function yyCultivationCrossCheck(role){
 const independent=yyIndependentCultivation(role),source=yyRoleCultivationModel(role);
 return independent.map(item=>{
  const original=source.records.find(x=>x.id===item.id);
  const comparable=item.learned!==null&&original?.learned!==null&&item.current!==null&&original?.current!==null;
  const mismatch=comparable&&(item.learned!==original.learned||item.current!==original.current);
  const unverified=!comparable||item.unknown>0||original?.unknown>0;
  return {...item,originalLearned:original?.learned??null,originalCurrent:original?.current??null,
   mismatch,unverified};
 });
}
function yyCultivationCrossCheckView(role){
 const checks=yyCultivationCrossCheck(role),mismatches=checks.filter(x=>x.mismatch);
 const uncertainties=checks.filter(x=>x.unverified);
 return yyRoleSection('무학 수련 독립 교차 검사',
 '<p class="micro">동일 원본 단계표를 서로 다른 계산 경로로 검사합니다. 수련 이전·전투 패널과의 실제 일치 여부를 검증하는 기능은 아닙니다.</p>'+

 '<div class="yy-account-scroll"><table class="module-table"><thead><tr><th>계열</th><th>습득 무학</th><th>독립 계산</th><th>원본 계산</th><th>검사</th></tr></thead><tbody>'+
 checks.map(x=>'<tr><td>'+escape(({1:'권법',2:'도법',3:'검법',4:'창·곤',ng:'내공',qg:'경공'})[x.id]||x.id)+'</td>'+

 '<td>'+(x.mismatch?'불일치':x.unverified?'미확인':'일치')+'</td></tr>').join('')+
 '</tbody></table></div>');
}
function yyProgressStat(model){
 let filled=0,total=0,started=0,complete=0,unknown=0;
 for(const item of model?.items||[]){
  if(item.values.some(v=>v.current===null)){unknown++;continue}
  const exists=item.values.some(v=>v.current>0);
  const done=item.values.length>0&&item.values.every(v=>v.current>=v.max);
  if(exists)started++;
  if(done)complete++;
  for(const v of item.values){filled+=v.current;total+=v.max}
 }

}

function yyCultivationAudit(entries){
 const missing=new Map(),source=window.KONGFU_DATA||{};
 const categories=[['Taolus','taolu'],['Neis','nei'],['Qings','qing']];
 for(const {r,stats} of entries){
  for(const [field,kind] of categories){
   const rows=characterEntries(r.raw?.[field]);
   for(const skill of rows){
    if(!skill||Number(skill.ID)<=0)continue;
    const id=String(skill.ID),copyId=Number(skill.CopyID||0);
    const base=source[kind]?.[id],copy=copyId>0&&kind==='taolu'?source.taolu?.[String(copyId)]:null;
    const cfg=copyId>0&&kind==='taolu'?copy:base;
    const issues=[];
    if(!base)issues.push('기본 무학 ID 미연결');
    if(copyId>0&&kind==='taolu'&&!copy)issues.push('복제 무학 ID 미연결');
    if(cfg&&(!Number.isFinite(Number(cfg.grade))||!Number.isFinite(Number(cfg.wxxw))))issues.push('수련 기준 누락');
    if(cfg&&kind==='taolu'&&!Number.isFinite(Number(cfg.type)))issues.push('무기 계열 누락');
    if(cfg&&Number.isFinite(Number(skill.Level))&&Number.isFinite(Number(skill.Chong))){
     const rateIndex=(Number(skill.Chong)-1)*4+Number(skill.Level)+1;
     const grade=Math.min(5,Math.max(1,Number(cfg.grade)));
     const rate=source.rate?.[String(rateIndex)]?.['kf_'+grade];
     if(!Number.isFinite(Number(rate)))issues.push('정진·수련 단계율 누락');
    }
    const level=Number(skill.Level),chong=Number(skill.Chong);
    if(!Number.isFinite(level)||!Number.isFinite(chong))issues.push('수련 단계 저장값 누락');
    if(!issues.length)continue;
    const key=field+':'+id+':'+copyId+':'+issues.join(',');
    const item=missing.get(key)||{id,copyId,field,issues,count:0,roles:[]};
    item.count++;
    item.roles.push(r.name);
    missing.set(key,item);
   }
  }
  // Include source evaluator failures which may not be apparent from the table alone.
  for(const track of stats.records){
   for(const unknownId of track.unknownSkills||[]){
    if(unknownId==='未识别记录')continue;
    const id=String(unknownId);
    const key='source:'+track.id+':'+id;
    if(!missing.has(key))missing.set(key,{id,copyId:0,field:track.name,
     issues:['원본 수련 단계표에서 계열 판정 실패'],count:1,roles:[r.name]});
   }
  }
 }
 return [...missing.values()].sort((a,b)=>b.count-a.count||a.id.localeCompare(b.id));
}

// Quest browsing uses real save fields. Never infer mission completion from NPC r bitfields.
function questSaveModel(root){
 const data=root&&typeof root==='object'?root:{};
 const current=data.Task&&typeof data.Task==='object'?data.Task:null;
 const delegated=data.WeiTuoTask&&typeof data.WeiTuoTask==='object'?data.WeiTuoTask:{};
 const npc=data.SoloNpc&&typeof data.SoloNpc==='object'?data.SoloNpc:{};
 const npcRecords=Object.entries(npc).filter(([id,x])=>x&&typeof x==='object').map(([id,x])=>({
  id,map:typeof x.m==='string'?x.m:'',x:x.x==null?null:Number(x.x),y:x.y==null?null:Number(x.y),
  located:typeof x.m==='string'&&x.m.length>0&&x.x!=null&&x.y!=null&&
    Number.isFinite(Number(x.x))&&Number.isFinite(Number(x.y))
 }));
 return {current,trace:current?.trace===true,delegated:{
  accepted:Array.isArray(delegated.accept)?delegated.accept:[],
  recorded:Array.isArray(delegated.task)?delegated.task:[]
 },npcRecords,located:npcRecords.filter(x=>x.located)};
}

function questAreaSummary(model){
 const map=new Map();
 for(const entry of model.located){
  const row=map.get(entry.map)||{code:entry.map,count:0};
  row.count++;map.set(entry.map,row);
 }
 return [...map.values()].sort((a,b)=>b.count-a.count||a.code.localeCompare(b.code));
}
function questExportCsv(model,selectedArea=''){
 const rows=[['구분','NPC 또는 임무 ID','지도 코드','X','Y','기록']];
 const task=model.current;
 if(task?.id!=null)rows.push(['현재 임무',task.id,'','','',task.trace===true?'추적 중':'추적 안 함']);
 for(const kind of [['위탁 수락',model.delegated.accepted],['위탁 기록',model.delegated.recorded]]){
  for(const value of kind[1])rows.push([kind[0],value,'','','','원본 저장값']);
 }
 for(const npc of model.npcRecords){
  if(selectedArea&&npc.map!==selectedArea)continue;
  rows.push(['NPC 위치',npc.id,npc.map,npc.located?npc.x:'',npc.located?npc.y:'',npc.located?'좌표 저장됨':'좌표 미확인']);
 }
 const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 return '\uFEFF'+csv+'\r\n';
}

ndThemeToEquipment(frame,t);try{localStorage.setItem('nangman-theme',t)}catch{}}$('paper').onclick=()=>theme('paper');$('ink').onclick=()=>theme('ink');try{theme(localStorage.getItem('nangman-theme')==='ink'?'ink':'paper')}catch{theme('paper')}try{const stored=sessionStorage.getItem('nangman_shared_save_v1');if(stored){const obj=JSON.parse(stored);if(obj&&typeof obj==='object'){save=obj;roles=getRoles(obj);filename='브라우저 세션의 이전 세이브';equipSaveVersion++;selected=0;}}}catch(err){console.info('저장된 세이브 복구 실패',err)};render()

<script type="module">
import {washEngine} from './engine/local-engine-bridge.js';
const state=window.__washRuntime={ready:false,active:false,error:'',output:'',loading:false,log:[],undoStates:[],generation:0};
function syncWasmBag(obj){state.bagPills=obj?.has_bag_pills===true&&Number.isFinite(Number(obj.bag_pills))?Number(obj.bag_pills):null;}
function announce(){window.dispatchEvent(new Event('nangman-wash-updated'))}
function fields(evt){for(const key of ['seed','roleId','zizhi','count'])if(evt[key]!==undefined&&evt[key]!==null)state[key]=evt[key];}
window.addEventListener('nangman-wash-command',async e=>{
 if(state.loading)return;
 const {op}=e.detail;if(op!=='washEngineImport')fields(e.detail);state.loading=true;state.error='';
 const generation=state.generation||0;
 const ensureSession=()=>{if(state.generation!==generation)throw Error('세이브 또는 캐릭터가 변경되어 이전 WASM 실행 결과를 폐기했습니다.');};
 try{
 if(op==='washEngineInit'){
  await washEngine.call('init');state.ready=true;state.output='yy-sim WASM 엔진 초기화 성공. 시험 상태를 설정하세요.';
 }else if(op==='washEngineImport'){
  const source=window.__nangmanWashSaveSource?.();
  if(!source?.save||!source.role)throw Error('선택된 세이브 캐릭터가 없습니다.');
  if(!state.ready){await washEngine.call('init');state.ready=true}
  const previous=await washEngine.call('state');
  const mapped=window.__nangmanBuildWashState(source.save,source.role,previous);
  const applied=await washEngine.call('set-state',mapped);
  ensureSession();
  if(window.__nangmanWashSaveSource?.()?.save!==source.save||
     window.__nangmanWashSaveSource?.()?.role?.id!==source.role.id)
   throw Error('불러오기 도중 세이브나 캐릭터가 바뀌었습니다. 다시 연결하세요.');
  if(Number(applied?.role_id)!==Number(source.role.id)||Number(applied?.seed)!==mapped.seed)
   throw Error('WASM에서 세이브 시드·캐릭터가 일치하지 않아 실행을 중단했습니다.');
  state.origin='save';state.linkedRoleId=source.role.id;state.lastConflict=null;state.active=true;state.liveTalents=applied.talents||[];syncWasmBag(applied);
  state.seed=String(mapped.seed);state.roleId=String(mapped.role_id);state.zizhi=String(mapped.zizhi);
  state.log=[];state.undoStates=[];state.preview=null;state.autoResult=null;state.autoProgress=null;state.yyLinkedResult=null;state.yySelectedWashNos=[];state.previewNameIds=null;state.pathReports=null;state.constraints=null;state.constraintsDisplay='';state.output='현재 인물 세이브 상태를 WASM에 적용했습니다. 이 결과는 실게임 검증 전 독립 시뮬레이션입니다.\n'+
   JSON.stringify({roleId:applied.role_id,zizhi:applied.zizhi,sex:applied.sex,locked:applied.talents?.filter(x=>x.locked).length,
    talLucky:applied.tal_lucky,mode:applied.mode},null,2);
  // Successful import stays usable even if this auxiliary native inspection fails.
  try{
   const checks=await washEngine.call('talent-constraints');
   ensureSession();
   if(window.__nangmanWashSaveSource?.()?.save===source.save &&
      window.__nangmanWashSaveSource?.()?.role?.id===source.role.id){
    state.constraints=checks;state.constraintsDisplay=JSON.stringify(checks);
   }
  }catch(checkError){state.constraintsError=String(checkError?.message||checkError);}
 }else if(op==='washEngineReset'){
  if(!state.ready)throw Error('WASM 먼저 초기화');
  if(!/^\d{1,20}$/.test(state.seed)||!/^\d{1,10}$/.test(state.roleId))throw Error('시드와 캐릭터 ID에 정수를 입력하세요.');
  const data=await washEngine.call('state');
  Object.assign(data,{seed:state.seed,role_id:Number(state.roleId),zizhi:Number(state.zizhi)||153,sex:1,vip:1,
    talents:[],tal_lucky:0,total_wash:0,total_pills:0,gold_count:0,pity_count:0,exchange_count:0});
  const next=await washEngine.call('set-state',data);
  state.origin='test';state.linkedRoleId=null;state.lastConflict=null;state.active=true;state.liveTalents=next?.talents||[];syncWasmBag(next);state.log=[];state.undoStates=[];state.preview=null;state.autoResult=null;state.autoProgress=null;state.yyLinkedResult=null;state.yySelectedWashNos=[];state.previewNameIds=null;state.pathReports=null;state.constraints=null;state.constraintsDisplay='';state.output='시험 상태 설정 완료\n'+JSON.stringify(next,null,2);
 }else if(op==='washEnginePreview'){
  if(!state.active)throw Error('먼저 현재 캐릭터 세이브를 WASM에 연결하세요.');
  if(state.origin==='save'&&window.__nangmanWashSaveSource?.()?.role?.id!==state.linkedRoleId)
   throw Error('선택된 캐릭터가 변경되었습니다. 다시 연결하세요.');
  const count=Number(e.detail.count||900);
  if(!Number.isInteger(count)||count<1||count>5000)throw Error('미리보기 범위는 1~5000회입니다.');
  const result=await washEngine.call('preview',{count});
  ensureSession();
  state.preview=result?.preview||{purples:[]};state.previewNameIds=result?.nameIds||{};
  state.yyLinkedResult=null;state.yySelectedWashNos=[];state.yyLinkedPad=null;
  state.previewLimit=count;
  state.output='WASM 자맥 시퀀스 조회 '+count+'회 · 결과 '+(state.preview?.purples?.length||0)+'건';
 }else if(op==='washEngineToggleLock'||op==='washEngineExchangeTalent'){
  if(!state.active||state.origin!=='save')throw Error('선택 캐릭터 세이브의 WASM 사본을 먼저 연결하세요.');
  if(window.__nangmanWashSaveSource?.()?.role?.id!==state.linkedRoleId)
   throw Error('선택 캐릭터가 변경되었습니다. WASM 사본을 다시 연결하세요.');
  const index=Number(e.detail.index);
  if(!Number.isInteger(index)||index<0||index>=4)throw Error('재능 슬롯 번호가 잘못되었습니다.');
  const snapshot=await washEngine.call('state');
  if(!snapshot||!Array.isArray(snapshot.talents)||!snapshot.talents[index])
   throw Error('WASM 재능 슬롯을 확인할 수 없습니다.');
  if(op==='washEngineExchangeTalent'&&snapshot.talents[index].locked)
   throw Error('잠금 슬롯은 치환할 수 없습니다.');
  const action=op==='washEngineToggleLock'?'toggle-lock':e.detail.requireConflict===true?'exchange-matched':'exchange-talent';
  const result=await washEngine.call(action,{index});
