<body><div class="app-shell-bg" aria-hidden="true"></div><div class="shell"><header class="top"><div class="brand">낭만강호<small>한국판 통합 시뮬레이터</small></div><nav class="nav" id="nav"></nav><div class="tools"><button id="saveLink" class="save-link">세이브</button><div class="theme"><button id="paper" class="on" aria-label="밝은 테마">밝은 테마</button><button id="ink" aria-label="어두운 테마">어두운 테마</button></div></div></header>
<main class="page"><div class="heading"><h1 id="title">세수 시뮬레이션</h1><span class="micro" id="status">세이브 미연결</span><div class="session-meta"><span class="session-label">보유 세수단 <b id="washBag">—</b></span><button id="import" class="btn">세이브 불러오기</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><div id="view"></div></main><footer class="foot">독립 사이트 v0.4.0 · yy-sim 화면 구성 참고 · 한국판 계산 엔진 검증 후 연결</footer></div>
<script>
(()=>{'use strict';const tabs=[['wash','세수'],['equip','장비'],['character','캐릭터'],['wiki','백과'],['sect','항산'],['daily','일일'],['battle','전투'],['drop','드랍'],['quest','임무']];let v='wash',sub='sim',save=null,filename='',roles=[],selected=0,filter='';
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));const card=(t,x)=>'<section class="card"><h3>'+t+'</h3>'+x+'</section>';
function getRoles(o){let a=[],ids=new Set;function add(r,type){if(!r||typeof r!=='object')return;const id=r.ID??r.Id??r.id;if(id==null||ids.has(String(id)))return;ids.add(String(id));a.push({id,type,name:String(r.Name||r.NickName||r.name||'캐릭터 '+id).trim(),level:r.Lv??r.Level??''})}add(o.MainRole,'주인공');for(let [key,type] of [['Roles','동료'],['Leavers','이탈']]){let x=o[key]||[],items=Array.isArray(x)?x:Object.values(typeof x==='object'?x:{});items.forEach(r=>add(r,type))}return a}
function roleList(){const cats=['주인공','동료','이탈'];let out='';for(const cat of cats){const items=roles.filter(x=>x.type===cat);if(!items.length)continue;out+='<div class="role-g"><div class="role-title">'+cat+'<span>'+items.length+'</span></div>'+items.filter(r=>(r.name+' '+r.id).toLowerCase().includes(filter.toLowerCase())).map(r=>{const i=roles.indexOf(r);return '<button class="role '+(selected===i?'active':'')+'" data-role="'+i+'"><span class="avatar">'+escape(r.name.slice(0,1))+'</span><span><b>'+escape(r.name)+'</b><small>ID '+escape(r.id)+(r.level?' · Lv'+escape(r.level):'')+'</small></span></button>'}).join('')+'</div>'}return out||'<p class="blank">JSON 세이브를 불러오면 캐릭터 목록이 표시됩니다.</p>'}
const stats=x=>'<div class="stats">'+x.map(([v,t])=>'<div class="stat"><b>'+v+'</b><span>'+t+'</span></div>').join('')+'</div>';
function wash(){
const r=roles[selected];
const groups=['주인공','동료','이탈'];
const aside='<aside class="aside"><div class="aside-title"><strong>캐릭터 선택 (총 '+roles.length+'명)</strong></div><input type="search" id="search" placeholder="이름 / 태그 / 소속 / ID 검색" value="'+escape(filter)+'"><div class="roles">'+roleList()+'</div></aside>';
const meta=r?('ID '+escape(r.id)+' · '+escape(r.level?r.level+'레벨':'레벨 미확인')+' · '+escape(r.type)+' · 보유 세수단 —'):'한국판 JSON 세이브를 불러오세요';
const fig='<div class="figures"><div class="fig"><b>—<small>/900</small></b><span>천장 진행도</span></div><div class="fig"><b>—</b><span>세수 횟수</span></div><div class="fig"><b>—</b><span>소모 세수단</span></div><div class="fig"><b>—</b><span>자맥 등장</span></div></div>';
const hero='<header class="hero"><div><h2>'+escape(r?.name||'캐릭터 미선택')+'</h2><div class="micro">'+meta+' · <button class="text-action" type="button" disabled>캐릭터 초기화</button></div></div>'+fig+'</header>';
const tabbar='<nav class="tabs">'+[['sim','세수'],['exchange','치환 시퀀스'],['path','경로 탐색']].map(([id,t])=>'<button data-sub="'+id+'" class="'+(sub===id?'active':'')+'">'+t+'</button>').join('')+'</nav>';
let body='';
if(sub==='sim'){
 const config='<section class="wash-config"><div class="config-item"><span>성별</span><button class="select-mock" disabled>— <i>⌄</i></button></div><div class="config-item"><span>VIP</span><button class="select-mock" disabled>— <i>⌄</i></button></div><div class="config-item"><span>자질</span><button class="select-mock" disabled>— <i>⌄</i></button></div><div class="zizhi">'+[['완력','—'],['근골','—'],['신법','—'],['내식','—'],['총합','—']].map(([k,v])=>'<span>'+k+' <b>'+v+'</b></span>').join('')+'</div></section>';
 const skills='<section class="wash-section"><div class="section-header"><h3>현재 재능</h3><span class="micro">4칸 · 실제 세이브 연결 전</span></div><div class="talents">'+[1,2,3,4].map((n)=>'<div class="talent"><span class="talent-slot">'+n+'</span><div class="talent-text"><b>미확인 재능</b><small>한국판 세수 데이터를 연결하면 표시됩니다.</small></div><button class="btn lock" disabled>잠금</button></div>').join('')+'</div></section>';
 const buttons='<section class="wash-section"><div class="wash-ops"><div class="pity-area"><div class="micro">천장 진행도</div><div class="pity-track"><div class="pity-fill" style="width:0%"></div></div><div class="micro">— / 900 · 다음 자맥 계산 대기</div></div><div class="wash-buttons"><button class="btn" disabled>자맥까지 세수</button><button class="btn" disabled>연속 세수</button><button class="btn" disabled>되돌리기</button><button class="btn primary" disabled>세수</button></div></div><div class="micro">한국판 시드·잠금 매핑 전에는 잘못된 예측을 방지하기 위해 실행할 수 없습니다.</div></section>';
 const history='<section class="wash-section"><div class="section-header"><h3>세수 기록</h3><div><button class="text-action" disabled>핵심 기록 내보내기</button><button class="text-action" disabled>전체 기록 내보내기</button><button class="text-action" disabled>비우기</button></div></div><div class="history">세수 기록이 없습니다.</div></section>';
 body=config+skills+buttons+history;
}
if(sub==='exchange')body='<section class="wash-section"><div class="section-header"><h3>치환 시퀀스</h3><button class="btn" disabled>+2,000회</button></div><div class="fields"><label>미리보기 슬롯<input disabled value="4칸"></label><label>탐색 상한<input disabled value="5000"></label></div><div class="notice">원본 yy-sim의 치환 시퀀스 패널 배치를 반영했습니다. 계산 결과는 엔진 연결 후 표시됩니다.</div><div class="history">자맥 후보 · 충돌맥 · 간격 · 천장 여부 표시 영역</div></section>';
if(sub==='path')body='<section class="wash-section"><div class="section-header"><h3>목표 자맥 경로 탐색</h3></div><div class="fields"><label>목표 자맥<input disabled placeholder="목표 자맥 선택"></label><label>최대 탐색 횟수<input disabled value="5000"></label></div><div class="actions"><button class="btn primary" disabled>세수 경로 탐색</button></div><div class="notice">실제 세이브 시드가 검증되면 자동 경로 탐색을 연결합니다.</div></section>';
return '<div class="layout">'+aside+'<div class="work">'+hero+tabbar+body+'</div></div>';
}
function saveView(){return '<div class="cards">'+card('세이브 관리','<p class="muted">JSON 파일은 브라우저 내부에서만 처리합니다.</p><button id="loadHere" class="btn primary">JSON 불러오기</button><button id="clear" class="btn" '+(!save?'disabled':'')+'>세이브 해제</button>')+card('파일 정보',stats([[String(roles.length),'캐릭터'],[String(save?Object.keys(save).length:0),'최상위 필드']])+'<p class="micro">'+escape(filename||'세이브 없음')+'</p>')+'</div>'}
function others(){if(v==='equip')return '<div class="cards">'+card('한국판 장비 시뮬레이터','<div class="tabs"><button class="active">제작</button><button disabled>가방</button><button disabled>자동 탐색</button><button disabled>홍무</button></div><div class="notice">yy-sim 장비 계산은 한국판과 달라 사용하지 않습니다. Roboking·산부진 엔진을 검증 후 연결합니다.</div>')+card('정련·망정','<p class="muted">한국판 계산 엔진 연결 예정</p>')+'</div>';
if(v==='character')return card('캐릭터 분석','<p class="muted">인식한 캐릭터 '+roles.length+'명</p>'+stats([[String(roles.filter(r=>r.type==='주인공').length),'주인공'],[String(roles.filter(r=>r.type==='동료').length),'동료'],[String(roles.filter(r=>r.type==='이탈').length),'이탈']]));
if(v==='wiki')return card('한국판 백과','<div class="tabs">'+['전체','동료','무학','장비','재능','임무'].map((x,i)=>'<button '+(!i?'class="active"':'disabled')+'>'+x+'</button>').join('')+'</div><div class="notice">NangmanGame 한국판 APK 데이터를 연결할 예정이며 중국판 데이터를 임의로 사용하지 않습니다.</div>');
const info={sect:['항산파','한국판 미출시 · 미구현'],battle:['전투 자동 시뮬레이션','미구현 · 기능 개발 대상 제외'],daily:['일일 콘텐츠','귀시 예측·일일 콘텐츠'],drop:['드랍 예측','필드·관문 RNG'],quest:['임무 검색','NPC·지역·진행 상태']};return card(info[v][0],'<p class="muted">'+info[v][1]+'</p><div class="notice">한국판 데이터 검증 후 기능 연결 예정</div>')}
function render(){$('nav').innerHTML=tabs.map(([id,t])=>'<button data-view="'+id+'" class="'+(v===id?'active':'')+'">'+t+((id==='sect'||id==='battle')?'<span class="wip">미구현</span>':'')+'</button>').join('');$('saveLink').classList.toggle('active',v==='save');$('title').textContent=v==='wash'?'세수 시뮬레이션':v==='save'?'세이브 관리':v==='quest'?'임무 검색':v==='sect'?'항산파 (미구현)':v==='battle'?'전투 (미구현)':Object.fromEntries(tabs)[v];$('status').textContent=save?'세이브 연결 · '+roles.length+'명 · '+filename:'한국판 세이브 미연결';$('view').innerHTML=v==='wash'?wash():v==='save'?saveView():others();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{v=b.dataset.view;render()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.role);render()});if($('search'))$('search').oninput=e=>{filter=e.target.value;const i=e.target.selectionStart;render();const s=$('search');s.focus();s.setSelectionRange(i,i)};if($('loadHere'))$('loadHere').onclick=()=>$('file').click();if($('clear'))$('clear').onclick=()=>{save=null;filename='';roles=[];selected=0;render()}}
$('saveLink').onclick=()=>{v='save';render()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>50e6)throw Error('파일 용량 50MB 초과');let obj=JSON.parse(await f.text());let root=obj?.data?.MainRole?obj.data:obj?.save?.MainRole?obj.save:obj;if(!root||typeof root!=='object'||Array.isArray(root))throw Error('JSON 최상위 객체가 아닙니다');save=root;filename=f.name;roles=getRoles(root);selected=0;render()}catch(err){alert('불러오기 실패: '+err.message)}};function theme(t){document.documentElement.dataset.theme=t;$('paper').classList.toggle('on',t==='paper');$('ink').classList.toggle('on',t==='ink');try{localStorage.setItem('nangman-theme',t)}catch{}}$('paper').onclick=()=>theme('paper');$('ink').onclick=()=>theme('ink');try{theme(localStorage.getItem('nangman-theme')==='ink'?'ink':'paper')}catch{theme('paper')}render()
})();
</script></body></html>
