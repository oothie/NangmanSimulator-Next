<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f5"><title>낭만강호 통합 시뮬레이터 v0.2.1</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#20272d;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:245px;flex-shrink:0;background:#fff;border-right:1px solid #ddd;padding:22px 14px}.brand{font-size:18px;font-weight:750;margin:4px 12px 28px}.sub{font-size:12px;color:#73808c;font-weight:400;display:block;margin-top:7px}.group{font-size:11px;color:#77818a;padding:14px 12px 7px}.nav{width:100%;text-align:left;padding:11px 12px;background:none;border:0;border-radius:8px;color:#374351}.nav.active{background:#eaf2ed;color:#26734b;font-weight:700}.main{flex:1;min-width:0;padding:28px 4vw;max-width:1350px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding-bottom:19px}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 12px}.pill{font-size:12px;border:1px solid #ccd5d2;border-radius:30px;padding:6px 10px}.panel{background:white;border:1px solid #e2e5e2;border-radius:12px;padding:22px;margin-top:20px}.secondary{color:#66727b;font-size:14px;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.btn{border:1px solid #cbd1ce;border-radius:8px;background:#fff;padding:9px 12px}.btn.primary{background:#28734d;color:white;border-color:#28734d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{border:1px solid #e4e5e4;border-radius:10px;padding:15px}.stat strong{display:block;font-size:20px;margin:7px 0}.warn{color:#99631c}.foot{font-size:12px;color:#8b9299;padding:25px 0}textarea{width:100%;min-height:120px;padding:10px}input[type=search]{width:100%;padding:10px;border:1px solid #ccd4d0;border-radius:8px}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:300px;overflow:auto}body.dark{color:#e6e9ed;background:#15191d}body.dark .sidebar,body.dark .panel,body.dark .stat{background:#20262c;border-color:#38414a}body.dark .nav{color:#c8d1d8}body.dark .nav.active{background:#293e36;color:#98d8b3}body.dark .btn{background:#28323a;color:#e6e9ed;border-color:#48535d}body.dark .btn.primary{background:#28734d}body.dark input{background:#20262c;color:white}@media(max-width:760px){.app{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid #ddd;padding:12px}.brand{margin:3px 9px 9px}.group{display:none}.menus{display:flex;overflow-x:auto;gap:3px}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:18px 16px}.top{align-items:flex-start}h1{font-size:22px}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand">낭만강호 시뮬레이터<span class="sub">한국판 통합 시뮬레이터 · v0.2.1</span></div><div class="menus" id="menus"></div></aside>
<main class="main"><div class="top"><h1 id="title">세수·도맥법</h1><button class="btn" id="theme">테마 전환</button></div><div class="panel"><b id="save-status">불러온 세이브 없음</b><div class="secondary">한국판 JSON 세이브는 이 브라우저에서만 처리합니다. 서버로 업로드하지 않습니다.</div><div class="actions"><button class="btn primary" id="load">JSON 세이브 불러오기</button><button class="btn" id="clear">세이브 해제</button><input type="file" id="file" accept=".json,application/json" hidden></div></div><section id="view"></section><div class="foot">독립 사이트 초기판 · 기존 Roboking 사이트와 별개 · 현재 미검증 계산 결과는 표시하지 않습니다.</div></main></div>
<script>
(()=>{'use strict';
const tabs=[['wash','세수·도맥법'],['equip','장비 제작·정련'],['character','캐릭터 분석'],['daily','일일 콘텐츠'],['drop','드랍 예측'],['wiki','한국판 백과'],['quests','임무 검색'],['save','세이브 관리']];
let current='wash',save=null,fileName='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('menus').innerHTML=tabs.map(([id,label])=>'<button class="nav" data-id="'+id+'">'+label+'</button>').join('');
const panel=(title,body)=>'<div class="panel"><h2>'+title+'</h2>'+body+'</div>';
const notice=t=>'<p class="secondary">'+t+'</p>';
const placeholder=(t,d)=>panel(t,notice(d)+notice('현재 계산 엔진 통합 전 단계입니다. 한국판과 결과가 다른 yy-sim 장비 계산은 사용하지 않습니다.'));
function render(){
 const label=tabs.find(x=>x[0]===current)[1];$('title').textContent=label;
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.id===current));
 $('save-status').textContent=save?'세이브 연결됨 · '+fileName:'불러온 세이브 없음';
 let content='';
 if(current==='wash')content=panel('세수·도맥법',notice('yy-sim 세수 계산 메커니즘을 한국판 세이브에 연결하는 작업 중입니다.')+'<p class="warn">시드·잠금·천장 매핑 검증 전까지 예측 버튼은 활성화하지 않습니다.</p>');
 if(current==='equip')content=placeholder('한국판 장비 계산','Roboking 한국판 장비 메커니즘과 산부진 계산을 비교하여 연결할 예정입니다.');
 if(current==='character'){const roles=save?(Array.isArray(save.Roles)?save.Roles:[]):[];content=panel('캐릭터 상태',save?'<div class="grid"><div class="stat">동료 데이터<strong>'+roles.length+'명</strong></div><div class="stat">주인공 데이터<strong>'+(save.MainRole?'확인':'없음')+'</strong></div></div>'+notice('세이브 필드 자동 추출은 후속 버전에서 확장합니다.'):notice('세이브를 불러오면 캐릭터 요약을 확인할 수 있습니다.'));}
 if(current==='daily')content=placeholder('귀시·일일 콘텐츠','yy-sim의 예측 UI와 한국판 세이브 시드 매핑을 검증한 후 추가합니다.');
 if(current==='drop')content=placeholder('드랍 예측','기존 한국판 RNG 검증 코드를 보존하고 관문·필드 시퀀스를 추가 분석합니다.');
 if(current==='wiki')content=panel('한국판 백과',notice('한국판 NangmanGame 데이터베이스와 연동할 예정입니다. 현재 시범 검색 UI입니다.')+'<input type="search" id="wikiSearch" placeholder="아이템·무학·동료 검색 (데이터 연결 예정)" aria-label="백과 검색"><div id="wikiOut" class="secondary"></div>');
 if(current==='quests')content=placeholder('임무 검색','한국판 임무 ID, NPC, 지역·좌표 데이터를 연결합니다.');
 if(current==='save')content=panel('세이브 관리',save?'<div class="grid"><div class="stat">최상위 필드<strong>'+Object.keys(save).length+'</strong></div><div class="stat">동료 배열<strong>'+(Array.isArray(save.Roles)?save.Roles.length:0)+'</strong></div></div><h2 style="margin-top:20px">필드 목록</h2><pre>'+esc(Object.keys(save).join(', '))+'</pre>':notice('한국판 JSON 파일을 위에서 선택하세요. 파일은 원격 서버에 전송되지 않습니다.'));
 $('view').innerHTML=content;
 if(current==='wiki')$('wikiSearch').addEventListener('input',()=>{$('wikiOut').textContent='한국판 데이터 연결 전이므로 아직 검색 결과를 제공하지 않습니다.';});
}
$('menus').addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b){current=b.dataset.id;render();}});
$('load').onclick=()=>$('file').click();
$('clear').onclick=()=>{save=null;fileName='';$('file').value='';render();};
$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>50*1024*1024)throw Error('50MB 초과 JSON은 로드할 수 없습니다.');const v=JSON.parse(await f.text());if(!v||Array.isArray(v)||typeof v!=='object')throw Error('JSON의 최상위 항목이 객체가 아닙니다.');save=v;fileName=f.name;render();}catch(err){alert('세이브 불러오기 실패: '+err.message);}};
$('theme').onclick=()=>document.body.classList.toggle('dark');
render();
})();
</script></body></html>
