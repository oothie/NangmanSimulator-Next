<!doctype html><html lang="ko" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낭만강호 통합 시뮬레이터 v0.3.1</title>
<style>
:root{--bg:#f3eee3;--paper:#f8f4eb;--panel:#fffdf7;--text:#231e17;--sub:#776e60;--border:#d6caba;--gold:#9c7941;--green:#336f52;--purple:#865b96;font-family:system-ui,"Malgun Gothic",sans-serif}
[data-theme=ink]{--bg:#131419;--paper:#1d2027;--panel:#252830;--text:#e9e3d9;--sub:#aba59c;--border:#44454d;--gold:#cca76b;--green:#76bb8c;--purple:#be99d1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}button,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.43;cursor:not-allowed}
.shell{max-width:1320px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:24px;background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:15px 20px;box-shadow:0 4px 18px #4139260d}.brand{font-family:serif;font-size:25px;flex-shrink:0}.brand small{display:block;font:11px system-ui;color:var(--sub);letter-spacing:1px}.nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}.nav button,.save-link{padding:8px 12px;border:0;background:transparent;border-radius:5px;color:var(--sub)}.nav button.active,.nav button:hover,.save-link.active{background:#ad8b4c28;color:var(--text);font-weight:700}.nav button.active{border-bottom:2px solid var(--gold)}.tools{display:flex;align-items:center;gap:8px;margin-left:auto}.theme{display:flex;border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px}.theme button{border:0;background:transparent;padding:5px 8px;font-size:12px;border-radius:4px;color:var(--sub)}.theme button.on{background:var(--panel);color:var(--text)}
.page{margin-top:15px;background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:18px 20px 25px}.heading{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:1px 0 16px}.heading h1{font:700 23px Georgia,serif;margin:0}.muted{color:var(--sub)}.micro{font-size:12px;color:var(--sub)}.btn{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:8px 12px}.btn.primary{background:#477b59;border-color:#477b59;color:white}.btn:hover:not(:disabled){filter:brightness(.97)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;margin-top:15px}.aside,.work,.card{border:1px solid var(--border);background:var(--panel);border-radius:7px}.aside{padding:14px;align-self:start}.work{padding:18px;min-width:0}.aside-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.role-g{margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}.role-title{display:flex;justify-content:space-between;color:var(--sub);font-size:12px}.role{display:flex;width:100%;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:6px;padding:8px;text-align:left}.role.active,.role:hover{background:#a3884b21;border-color:var(--border)}.avatar{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:var(--paper);border:1px solid var(--border);color:var(--green);flex-shrink:0}.role b,.role small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.role small{font-size:11px;color:var(--sub)}.roles{max-height:65vh;overflow:auto}input{width:100%;padding:9px;border:1px solid var(--border);background:var(--paper);border-radius:5px}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:15px}.hero h2{font:700 23px Georgia,serif;margin:0 0 6px}.figures{display:flex;gap:4px;flex-wrap:wrap}.fig{padding:0 11px;text-align:center;border-left:1px solid var(--border)}.fig b{display:block;font:600 23px Georgia,serif}.fig span{font-size:11px;color:var(--sub)}.fig.purple b{color:var(--purple)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:13px 0 15px;overflow-x:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:9px 14px;white-space:nowrap;color:var(--sub)}.tabs button.active{color:var(--text);border-bottom-color:var(--gold);font-weight:700}.card{padding:16px;margin:0 0 13px}.card h3{font-size:15px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{text-align:center;background:var(--paper);border:1px solid var(--border);border-radius:5px;padding:10px}.stat b{display:block;font-size:19px}.stat span{color:var(--sub);font-size:11px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:12px;background:#a88a4e15;border-left:3px solid var(--gold);font-size:12px;color:var(--sub);margin:12px 0}.history{background:var(--paper);border:1px solid var(--border);padding:12px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.blank{text-align:center;padding:24px;color:var(--sub)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.foot{text-align:center;color:var(--sub);font-size:11px;padding:22px}
@media(max-width:980px){.top{flex-wrap:wrap;gap:8px}.nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}.tools{margin-left:auto}.layout{grid-template-columns:230px minmax(0,1fr)}}@media(max-width:690px){.shell{padding:8px}.top{padding:10px}.brand{font-size:20px}.page{padding:12px}.layout{display:block}.aside{margin-bottom:12px}.roles{max-height:170px}.work{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.fields,.cards{grid-template-columns:1fr}}

/* yy-sim 산수화 계열의 한국판 독립 배경. 원본 사이트의 이미지 파일을 복제하지 않음. */
body{background-image:linear-gradient(180deg,#f5f0e9bb 0%,#efe9ddbb 68%,#e7e3d8dd),url('./assets/ink-landscape.svg');background-repeat:no-repeat;background-size:cover,100% auto;background-position:center,center 80px;background-attachment:fixed,fixed}
[data-theme=ink] body{background-image:linear-gradient(180deg,#15181ee5 0%,#171a21ea 70%,#191d23f0),url('./assets/ink-landscape.svg')}
.landscape{height:126px;margin:15px 0 0;border-radius:7px;border:1px solid var(--border);background-image:linear-gradient(90deg,#f6f0e45c 0%,transparent 25%,transparent 78%,#f6f0e450),url('./assets/ink-landscape.svg');background-size:cover;background-position:center 50%;box-shadow:inset 0 0 26px #d4c7b538;pointer-events:none}
[data-theme=ink] .landscape{filter:brightness(.65) saturate(.67);box-shadow:none}
.theme button{white-space:nowrap}
@media(max-width:690px){.landscape{height:84px;margin-top:11px}.theme button{padding:5px 6px;font-size:11px}}
</style></head>
<body><div class="shell"><header class="top"><div class="brand">낭만강호<small>한국판 통합 시뮬레이터 · v0.3.1</small></div><nav class="nav" id="nav"></nav><div class="tools"><button id="saveLink" class="save-link">세이브</button><div class="theme"><button id="paper" class="on" aria-label="밝은 테마">밝은 테마</button><button id="ink" aria-label="어두운 테마">어두운 테마</button></div></div></header>
<main class="page"><div class="heading"><h1 id="title">세수 시뮬레이션</h1><span class="micro" id="status">세이브 미연결</span><div><button id="import" class="btn primary">JSON 세이브 불러오기</button><input id="file" type="file" accept=".json,application/json" hidden></div></div><div class="landscape" role="img" aria-label="산과 대나무를 그린 산수화풍 배경"></div><div id="view"></div></main><footer class="foot">독립 사이트 v0.3.1 · yy-sim 화면 구성 참고 · 한국판 계산 엔진 검증 후 연결</footer></div>
<script>
(()=>{'use strict';const tabs=[['wash','세수'],['equip','장비'],['character','캐릭터'],['wiki','백과'],['daily','일일'],['drop','드랍'],['quest','임무']];let v='wash',sub='sim',save=null,filename='',roles=[],selected=0,filter='';
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));const card=(t,x)=>'<section class="card"><h3>'+t+'</h3>'+x+'</section>';
function getRoles(o){let a=[],ids=new Set;function add(r,type){if(!r||typeof r!=='object')return;const id=r.ID??r.Id??r.id;if(id==null||ids.has(String(id)))return;ids.add(String(id));a.push({id,type,name:String(r.Name||r.NickName||r.name||'캐릭터 '+id).trim(),level:r.Lv??r.Level??''})}add(o.MainRole,'주인공');for(let [key,type] of [['Roles','동료'],['Leavers','이탈']]){let x=o[key]||[],items=Array.isArray(x)?x:Object.values(typeof x==='object'?x:{});items.forEach(r=>add(r,type))}return a}
function roleList(){const cats=['주인공','동료','이탈'];let out='';for(const cat of cats){const items=roles.filter(x=>x.type===cat);if(!items.length)continue;out+='<div class="role-g"><div class="role-title">'+cat+'<span>'+items.length+'</span></div>'+items.filter(r=>(r.name+' '+r.id).toLowerCase().includes(filter.toLowerCase())).map(r=>{const i=roles.indexOf(r);return '<button class="role '+(selected===i?'active':'')+'" data-role="'+i+'"><span class="avatar">'+escape(r.name.slice(0,1))+'</span><span><b>'+escape(r.name)+'</b><small>ID '+escape(r.id)+(r.level?' · Lv'+escape(r.level):'')+'</small></span></button>'}).join('')+'</div>'}return out||'<p class="blank">JSON 세이브를 불러오면 캐릭터 목록이 표시됩니다.</p>'}
const stats=x=>'<div class="stats">'+x.map(([v,t])=>'<div class="stat"><b>'+v+'</b><span>'+t+'</span></div>').join('')+'</div>';
function wash(){let r=roles[selected],aside='<aside class="aside"><div class="aside-title"><strong>캐릭터 선택</strong><span class="micro">총 '+roles.length+'명</span></div><input type="search" id="search" placeholder="이름 / ID 검색" value="'+escape(filter)+'"><div class="roles">'+roleList()+'</div></aside>';let hero='<div class="hero"><div><h2>'+escape(r?.name||'캐릭터 미선택')+'</h2><div class="micro">'+(r?'ID '+escape(r.id)+' · '+escape(r.type)+(r.level?' · '+escape(r.level)+'레벨':''):'한국판 JSON 세이브를 불러오세요')+'</div></div><div class="figures">'+[['—','천장'],['—','세수 횟수'],['—','소모 세수단'],['—','자맥 등장']].map(([n,t],i)=>'<div class="fig '+(i===3?'purple':'')+'"><b>'+n+'</b><span>'+t+'</span></div>').join('')+'</div></div>';
let nav='<div class="tabs">'+[['sim','세수 시뮬'],['exchange','치환 시퀀스'],['path','경로 탐색']].map(([id,t])=>'<button data-sub="'+id+'" class="'+(sub===id?'active':'')+'">'+t+'</button>').join('')+'</div>';let body='';
if(sub==='sim')body=card('자질 · 캐릭터 상태',stats([['—','완력'],['—','근골'],['—','신법'],['—','내식']])+'<div class="notice">한국판 내식 용어 적용. 세이브 시드·맥 잠금·천장 연결 후 실제 값이 표시됩니다.</div>')+card('세수 실행','<div class="fields"><label>세수 시드<input disabled placeholder="한국판 세이브 매핑 예정"></label><label>실행 횟수<input disabled type="number" value="1"></label></div><div class="actions"><button class="btn primary" disabled>1회 세수</button><button class="btn" disabled>연속 세수</button><button class="btn" disabled>되돌리기</button></div><p class="micro">현재 UI 시범판으로 미검증 계산값을 생성하지 않습니다.</p>')+card('현재 자맥 · 결과 기록','<div class="history">세수 4칸 및 잠금 상태, 결과 기록을 표시할 영역입니다.</div>');
if(sub==='exchange')body=card('치환 시퀀스',stats([['4','슬롯'],['—','치환맥'],['—','충돌맥'],['—','탐색 회차']])+'<div class="notice">yy-sim 배치를 참고했습니다. 실제 세수 엔진 연결 전입니다.</div>');
if(sub==='path')body=card('목표 자맥 경로 탐색','<div class="fields"><label>목표 자맥<input disabled placeholder="목표 선택"></label><label>최대 탐색 횟수<input disabled value="5000"></label></div><div class="actions"><button class="btn primary" disabled>경로 탐색</button></div>');
return '<div class="layout">'+aside+'<div class="work">'+hero+nav+body+'</div></div>'}
function saveView(){return '<div class="cards">'+card('세이브 관리','<p class="muted">JSON 파일은 브라우저 내부에서만 처리합니다.</p><button id="loadHere" class="btn primary">JSON 불러오기</button><button id="clear" class="btn" '+(!save?'disabled':'')+'>세이브 해제</button>')+card('파일 정보',stats([[String(roles.length),'캐릭터'],[String(save?Object.keys(save).length:0),'최상위 필드']])+'<p class="micro">'+escape(filename||'세이브 없음')+'</p>')+'</div>'}
function others(){if(v==='equip')return '<div class="cards">'+card('한국판 장비 시뮬레이터','<div class="tabs"><button class="active">제작</button><button disabled>가방</button><button disabled>자동 탐색</button><button disabled>홍무</button></div><div class="notice">yy-sim 장비 계산은 한국판과 달라 사용하지 않습니다. Roboking·산부진 엔진을 검증 후 연결합니다.</div>')+card('정련·망정','<p class="muted">한국판 계산 엔진 연결 예정</p>')+'</div>';
if(v==='character')return card('캐릭터 분석','<p class="muted">인식한 캐릭터 '+roles.length+'명</p>'+stats([[String(roles.filter(r=>r.type==='주인공').length),'주인공'],[String(roles.filter(r=>r.type==='동료').length),'동료'],[String(roles.filter(r=>r.type==='이탈').length),'이탈']]));
if(v==='wiki')return card('한국판 백과','<div class="tabs">'+['전체','동료','무학','장비','재능','임무'].map((x,i)=>'<button '+(!i?'class="active"':'disabled')+'>'+x+'</button>').join('')+'</div><div class="notice">NangmanGame 한국판 APK 데이터를 연결할 예정이며 중국판 데이터를 임의로 사용하지 않습니다.</div>');
const info={daily:['일일 콘텐츠','귀시 예측·일일 콘텐츠'],drop:['드랍 예측','필드·관문 RNG'],quest:['임무 검색','NPC·지역·진행 상태']};return card(info[v][0],'<p class="muted">'+info[v][1]+'</p><div class="notice">한국판 데이터 검증 후 기능 연결 예정</div>')}
function render(){$('nav').innerHTML=tabs.map(([id,t])=>'<button data-view="'+id+'" class="'+(v===id?'active':'')+'">'+t+'</button>').join('');$('saveLink').classList.toggle('active',v==='save');$('title').textContent=v==='wash'?'세수 시뮬레이션':v==='save'?'세이브 관리':v==='quest'?'임무 검색':Object.fromEntries(tabs)[v];$('status').textContent=save?'세이브 연결 · '+roles.length+'명 · '+filename:'한국판 세이브 미연결';$('view').innerHTML=v==='wash'?wash():v==='save'?saveView():others();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{v=b.dataset.view;render()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.role);render()});if($('search'))$('search').oninput=e=>{filter=e.target.value;const i=e.target.selectionStart;render();const s=$('search');s.focus();s.setSelectionRange(i,i)};if($('loadHere'))$('loadHere').onclick=()=>$('file').click();if($('clear'))$('clear').onclick=()=>{save=null;filename='';roles=[];selected=0;render()}}
$('saveLink').onclick=()=>{v='save';render()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>50e6)throw Error('파일 용량 50MB 초과');let obj=JSON.parse(await f.text());let root=obj?.data?.MainRole?obj.data:obj?.save?.MainRole?obj.save:obj;if(!root||typeof root!=='object'||Array.isArray(root))throw Error('JSON 최상위 객체가 아닙니다');save=root;filename=f.name;roles=getRoles(root);selected=0;render()}catch(err){alert('불러오기 실패: '+err.message)}};function theme(t){document.documentElement.dataset.theme=t;$('paper').classList.toggle('on',t==='paper');$('ink').classList.toggle('on',t==='ink');try{localStorage.setItem('nangman-theme',t)}catch{}}$('paper').onclick=()=>theme('paper');$('ink').onclick=()=>theme('ink');try{theme(localStorage.getItem('nangman-theme')==='ink'?'ink':'paper')}catch{theme('paper')}render()
})();
</script></body></html>
