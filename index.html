<script>
(()=>{'use strict';const tabs=[['wash','세수'],['equip','장비'],['character','캐릭터'],['wiki','백과'],['daily','일일'],['drop','드랍'],['quest','임무'],['sect','항산'],['battle','전투']];let v=(['wash','character','wiki','daily','drop','quest','sect','battle','save'].includes(location.hash.slice(1))?location.hash.slice(1):'wash'),sub='sim',save=null,filename='',roles=[],selected=0,filter='';
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));const card=(t,x)=>'<section class="card"><h3>'+t+'</h3>'+x+'</section>';
function getRoles(o){let a=[],ids=new Set;function add(r,type){if(!r||typeof r!=='object')return;const id=r.ID??r.Id??r.id;if(id==null||ids.has(String(id)))return;ids.add(String(id));a.push({id,type,name:String(r.Name||r.NickName||r.name||'캐릭터 '+id).trim(),level:r.Lv??r.Level??'',raw:r})}add(o.MainRole,'주인공');for(let [key,type] of [['Roles','동료'],['Leavers','이탈']]){let x=o[key]||[],items=Array.isArray(x)?x:Object.values(typeof x==='object'?x:{});items.forEach(r=>add(r,type))}return a}
function roleList(){const cats=['주인공','동료','이탈'];let out='';for(const cat of cats){const items=roles.filter(x=>x.type===cat);if(!items.length)continue;out+='<div class="role-g"><div class="role-title">'+cat+'<span>'+items.length+'</span></div>'+items.filter(r=>(r.name+' '+r.id).toLowerCase().includes(filter.toLowerCase())).map(r=>{const i=roles.indexOf(r);return '<button class="role '+(selected===i?'active':'')+'" data-role="'+i+'"><span class="avatar">'+escape(r.name.slice(0,1))+'</span><span><b>'+escape(r.name)+'</b><small>ID '+escape(r.id)+(r.level?' · Lv'+escape(r.level):'')+'</small></span></button>'}).join('')+'</div>'}return out||'<p class="blank">JSON 세이브를 불러오면 캐릭터 목록이 표시됩니다.</p>'}
const stats=x=>'<div class="stats">'+x.map(([v,t])=>'<div class="stat"><b>'+v+'</b><span>'+t+'</span></div>').join('')+'</div>';

// 세수 엔진 연결 준비: 실제 한국판 세이브에서 확인 가능한 후보 필드만 추출
// 후보 수집은 계산 엔진에 전달하지 않으며 자동 예측 결과로 간주하지 않습니다.

// 한국판 세이브 원본 속성 조회: 계산식이나 추정값 없이 실제 존재하는 숫자 필드만 표시
function roleValues(role){
 const raw=role?.raw||{};
 const labels=[
 ['Lv','레벨'],['Level','레벨'],['Sex','성별'],['Str','완력'],['Con','근골'],['Dex','신법'],['Int','내식'],
 ['Atk','공격'],['Attack','공격'],['Def','방어'],['Defense','방어'],['HP','기혈'],['MaxHP','최대 기혈'],
 ['Speed','속도'],['Hit','명중'],['Dodge','회피'],['Crit','치명타'],['TrueDamage','진원 피해'],
 ['WashNum','세수 횟수'],['WashCount','세수 횟수'],['PityCount','천장 진행도'],['TalentCount','재능 수']
 ];
 const values=[],added=new Set();
 for(const [k,label] of labels){
  if(added.has(label))continue;
  const v=raw[k];
  if(v!==null&&v!==undefined&&['string','number','boolean'].includes(typeof v)&&String(v).length<70){
    values.push({key:k,label,value:String(v)});added.add(label);
  }
 }
 return values;
}
function roleDataPanel(){
 const r=roles[selected];
 if(!r)return '<section class="wash-section"><div class="notice">먼저 한국판 세이브를 불러오세요.</div></section>';
 const rows=roleValues(r);
 const table=rows.length?'<table class="module-table"><thead><tr><th>한국판 항목</th><th>세이브 필드</th><th>원본 값</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+escape(x.label)+'</td><td>'+escape(x.key)+'</td><td>'+escape(x.value)+'</td></tr>').join('')+'</tbody></table>':'<p class="micro">이 캐릭터에 직접 기록된 기본 능력치 필드를 찾지 못했습니다.</p>';
 return '<section class="wash-section"><div class="section-header"><h3>캐릭터 원본 능력치</h3><button id="downloadRole" class="btn">선택 캐릭터 JSON 저장</button></div><p class="micro">계산·추정하지 않고 세이브에 실제 존재하는 필드만 표시합니다.</p><div style="max-height:280px;overflow:auto">'+table+'</div></section>';
}
function washCandidates(role,root){
 const matching=/(wash|talent|lucky|pity|zizhi|seed|tal|xmai|xilian|exchange|ma[i]?|紫脉|洗髓|资质)/i;
 const out=[];const seen=new Set();
 function scan(obj,prefix,depth){
  if(!obj||typeof obj!=='object'||depth>3||out.length>=100)return;
  const entries=Array.isArray(obj)?obj.map((v,i)=>[String(i),v]).slice(0,48):Object.entries(obj).slice(0,180);
  for(const [key,value] of entries){
    if(out.length>=100)return;
    const path=prefix?prefix+'.'+key:key;
    if(seen.has(path))continue;seen.add(path);
    if(matching.test(key)){
      const val=(value===null||typeof value!=='object')?String(value??'null'):Array.isArray(value)?'[배열 '+value.length+'개]':'[객체]';
      out.push({path,value:val.slice(0,72),type:Array.isArray(value)?'배열':typeof value});
    }
    if(value&&typeof value==='object'&&depth<3&&!Array.isArray(value)&&Object.keys(value).length<120)scan(value,path,depth+1);
  }
 }
 if(role?.raw)scan(role.raw,'캐릭터',0);
 if(root){
  for(const [key,value] of Object.entries(root).slice(0,180)){
   if(matching.test(key)&&typeof value!=='object')out.push({path:'세이브.'+key,value:String(value).slice(0,72),type:typeof value});
  }
 }
 return out;
}
function diagnosticPanel(){
 if(!save)return '<section class="wash-section"><div class="notice">한국판 JSON 세이브를 불러오면 세수 관련 데이터 필드 후보를 점검할 수 있습니다. 아직 다음 세수 결과를 예측하지 않습니다.</div></section>';
 const fields=washCandidates(roles[selected],save);
 const rows=fields.slice(0,40).map(x=>'<tr><td>'+escape(x.path)+'</td><td>'+escape(x.value)+'</td><td>'+escape(x.type)+'</td></tr>').join('');
 return '<section class="wash-section"><div class="section-header"><h3>세수 엔진 연결 진단</h3><button id="exportWashDiagnostic" class="btn">후보 필드 JSON 내보내기</button></div><p class="micro">한국판 세이브에서 '+fields.length+'개의 키 후보를 찾았습니다. 이는 키 이름 검색 결과일 뿐, 실제 RNG 매핑이 확인됐다는 뜻은 아닙니다.</p><div style="max-height:230px;overflow:auto"><table class="module-table"><thead><tr><th>필드 경로</th><th>값 일부</th><th>형태</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="3">후보 필드를 찾지 못했습니다.</td></tr>')+'</tbody></table></div></section>';
}

function washSandbox(){
 const state=window.__washRuntime||{ready:false,active:false,error:'',log:[]};
 return '<section class="wash-section"><div class="section-header"><h3>yy-sim 세수 WASM 실행</h3><small>'+ (state.ready?'로컬 엔진 준비됨':'엔진 대기')+'</small></div>'+
 '<p class="micro">한국판 세이브의 시드·잠금 매핑은 아직 검증되지 않았습니다. 아래는 독립 시험 모드이며 실제 세이브를 변경하지 않습니다.</p>'+
 '<div class="module-columns">'+
 '<div class="module-group"><label>시험 세수 시드</label><input id="washSeedInput" inputmode="numeric" value="'+escape(state.seed||'2000548318')+'"></div>'+
 '<div class="module-group"><label>캐릭터 ID</label><input id="washRoleInput" inputmode="numeric" value="'+escape(state.roleId||roles[selected]?.id||10044)+'"></div>'+
 '<div class="module-group"><label>시험 자질</label><input id="washZizhiInput" type="number" min="1" value="'+escape(state.zizhi||153)+'"></div>'+
 '<div class="module-group"><label>연속 세수 횟수</label><input id="washTimesInput" type="number" min="1" max="100" value="'+escape(state.count||10)+'"></div></div>'+
 '<div class="actions"><button id="washEngineInit" class="btn" '+(state.loading?'disabled':'')+'>'+ (state.ready?'WASM 준비 완료':'로컬 WASM 초기화')+'</button>'+
 '<button id="washEngineReset" class="btn" '+(!state.ready?'disabled':'')+'>시험 상태 설정</button>'+
 '<button id="washEngineOnce" class="btn primary" '+(!state.active?'disabled':'')+'>1회 세수</button>'+

function wikiRows(){

 const localArts=(window.NANGMAN_ARTS_ID_KO||{}),localCrafts=(window.NANGMAN_CRAFT_ID_KO||{});
 const localRows=(data,kind)=>Object.entries(data).filter(([id])=>/^\d+$/.test(id)).map(([id,entry])=>({
  id:Number(id),n:String(entry.name||''),desc:String(entry.desc||''),icon:Number(id),kind
 }));
 const sources=[
  ['items',sourceData.items],['equips',sourceData.equips],['martial',sourceData.martial],
  ['crafts',(Array.isArray(sourceData.crafts)&&sourceData.crafts.length)?sourceData.crafts:localRows(localCrafts,'craft')],

   id:Number(id),n:entry[0],desc:entry[1]||'',icon:entry[2]||''

 ];

function wikiHasChinese(value){return /[\u3400-\u9fff]/.test(String(value||''))}

function wikiCleanDescription(value){return String(value||'').replace(/#[0-9a-fA-F]{6}#/g,'').replace(/\\n/g,'\n')}
function wikiV620EffectText(id,index,explicitPercent){
 const record=(window.NANGMAN_V620_BUFF_KO||{})[String(id)];
 const meta=record&&record[3]||{};
 const value=Number(meta['buff_fudu_'+index]);
 if(!Number.isFinite(value))return '';
 const type=String(meta['buff_type_'+index]||'');
 const percentage=/^(atk|def|hit|rating|dodge|parry|speed|hp|hp_n|hp_max|po_parry|po_dodge|dmg_off|dmg_ref|cure_sj|kang_debuff|blood|map_move|weapon_add)$/.test(type);
 const magnitude=percentage ? Math.abs(value)*100 : Math.abs(value);
 const number=Number(magnitude.toFixed(2));
 // 원문이 이미 %를 붙이는 경우 기호를 중복하지 않는다.
 return (value<0?'−':'')+number+(percentage&&!explicitPercent?'%':'');
}

 });

function characterLifeEffectSummary(record,raw){
 const cfg=(window.LIFE_HEDAO_DATA?.skills||{})[String(record.ID)];
 if(!cfg)return '효과 데이터 미연결';
 const level=Math.max(0,Number(record.Level)||0),menpai=Number(raw?.MenPai);
 let rows=cfg.effects||[];
 if(cfg.mp_sk!=null&&menpai!==Number(cfg.mp_sk)){
  rows=cfg.slots?.length?cfg.slots.map(x=>x.pan||x.effect).filter(Boolean):cfg.panEffects?.length?cfg.panEffects:rows;
 }
 if(!rows.length)return '원본 효과 수치 없음';
 const known=[],other=[];
 for(const row of rows){
  if(!Array.isArray(row)||row.length<3)continue;
  const key=String(row[0]),step=Number(row[1]),value=Number(row[2]);
  if(!Number.isFinite(step)||step<=0||!Number.isFinite(value))continue;
  const stages=Math.floor(level/step);
  if(!stages)continue;
  const amount=stages*value,label=characterLifeEffectNames[key];
  if(!label){other.push(key);continue}
  const isRate=Math.abs(value)<1;
  known.push(label+' +'+(isRate?Number((amount*100).toFixed(2))+'%':Number(amount.toFixed(2))));
 }
 return known.join(' · ')+(other.length?(known.length?' · ':'')+'기타 효과 '+other.length+'종':'')||'현재 레벨에서 활성 효과 없음';
}

function characterEquipSourceStats(raw){
 const gear=characterEntries(raw?.Equips).filter(e=>e&&typeof e==='object'&&Number(e.ID)>0);
 const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
 const list=v=>characterEntries(v).filter(x=>x&&typeof x==='object');
 const affixes=e=>{
  const regular=['EnMans','EnExts','EnSpecials','exts'].flatMap(k=>list(e[k])).map(x=>({
   key:String(x.Key??x.prop??x.key??''),value:n(x.Value??x.value)
  })).filter(x=>x.key);
  const story=list(e.EnStroys).filter(x=>typeof x.Buff==='string'&&x.Buff)
   .map(x=>({key:x.Buff,value:n(x.Type)}));
  return regular.concat(story);
 };
 const scaled=(e,field)=>Math.floor(n(e[field])*(1+n(e.LvProp)/1000));
 const byKeys=(e,keys)=>affixes(e).reduce((sum,x)=>sum+(keys.includes(x.key)?x.value:0),0);
 const definitions=[
  ['기혈','Hp',['hp_add','hp']],['방어','Def',['def_add','def']],
  ['회피','Dodge',['dodge_add','dodge']],['초식방어','Parry',['parry_add','parry']],
  ['속도','Speed',['speed_add','speed']],['인내','RenXing',['renxing']]
 ];
 const results=definitions.map(([label,key,keys])=>({
  label,base:gear.reduce((sum,e)=>sum+scaled(e,key),0),
  affix:gear.reduce((sum,e)=>sum+byKeys(e,keys),0)
 }));
 results.push({label:'강기',base:gear.reduce((sum,e)=>sum+n(e.Gangqi)+n(e.ExtraGangqi),0),
  affix:gear.reduce((sum,e)=>sum+byKeys(e,['gangqi','gq_base']),0)});
 results.push({label:'내경',base:gear.reduce((sum,e)=>sum+n(e.Neijin)+n(e.ExtraNeij),0),
  affix:gear.reduce((sum,e)=>sum+byKeys(e,['neij','neijin']),0)});
 return results;
}

function characterGlobalNumber(root,key){
 const obj=root?.globalVariable||root?.GlobalVariable||root?.P;
 if(!obj)return null;
 let val=obj[key];
 if(val===undefined&&Array.isArray(obj)){const found=obj.find(x=>x&&String(x.ID??x.Id??x.id??x.Key??x.key)===String(key));val=found;}
 if(val===undefined)return 0;
 if(val&&typeof val==='object')val=val.value??val.Value??val.val??val.Val;
 if(val===null||val===undefined||val==='')return null;
 const n=Number(val);return Number.isFinite(n)?n:null;
}

// 산부진 role_status_data.js 수련 구조: 6개 계열의 별도 WXXW 잔액, 각 1500 상한.
// 무학의 기여치는 KONGFU_DATA.rate/taolu/nei/qing 미확보 시 임의 합산하지 않는다.
const sanbujinCultivationKinds=[
 ['권법',1,'Taolus','jlgcc_'],['도법',2,'Taolus',null],['검법',3,'Taolus','jwgjz_'],
 ['창·곤',4,'Taolus',null],['내공','ng','Neis',null],['경공','qg','Qings',null]
];
function characterSanbujinCultivation(root,raw,role){
 const db=window.NANGMAN_SANBUJIN_KONGFU;
 const id=String(role.id),fmt=n=>n===null?'—':String(n);
 const nameMap=wikiKoMap();
 const skillName=skillId=>{
  const known=nameMap.get('martial:'+String(skillId));
  return known&&known.name&&!wikiHasChinese(known.name)?known.name:'#'+String(skillId);
 };
 const entries=sanbujinCultivationKinds.map(([name,kind,source,fixedKey])=>{
  const value=raw['WXXW'+kind];
  const extra=value==null||value===''||!Number.isFinite(Number(value))?null:Number(value);
  const fixed=fixedKey?characterGlobalNumber(root,fixedKey+id):0;
  const transferable=extra===null||fixed===null?null:Math.max(0,extra-fixed);
  const list=Array.isArray(raw[source])?raw[source]:raw[source]&&typeof raw[source]==='object'?Object.values(raw[source]):null;
  let unknown=0;
  const skills=[];
  if(list)for(const record of list){
   if(!record||typeof record!=='object'){unknown++;continue}
   const table=source==='Taolus'?'taolu':source==='Neis'?'nei':'qing';
   const cfg=db?.[table]?.[String(record.ID)];
   const copiedId=source==='Taolus'?Number(record.CopyID||0):0;
   const copied=Number.isFinite(copiedId)&&copiedId>0;
   const actual=copied?db?.taolu?.[String(copiedId)]:cfg;
   if(source==='Taolus'){
    if(!actual||!Number.isFinite(Number(actual.type))){unknown++;continue}
    if(Number(actual.type)!==Number(kind))continue;
   }
   const chong=Number(record.Chong),level=Number(record.Level),grade=Number(actual?.grade);
   const rateRow=db?.rate?.[String((chong-1)*4+level+1)];
   const rate=rateRow?.['kf_'+Math.min(5,Math.max(1,grade))];
   const current=!actual||!Number.isFinite(chong)||!Number.isFinite(level)||!Number.isFinite(grade)||!Number.isFinite(Number(rate))?null:Math.floor(Number(actual.wxxw||0)*Math.min(Number(rate),1));
   if(current===null)unknown++;
   skills.push({id:record.ID,copiedId:copied?copiedId:null,current});
  }
  const learned=list&&db&&unknown===0?skills.reduce((sum,x)=>sum+x.current,0):null;
  const rawTotal=learned===null||extra===null?null:learned+extra;
  const current=rawTotal===null?null:Math.min(1500,rawTotal);
  return {name,kind,extra,fixed,transferable,learned,current,overflow:rawTotal===null?null:Math.max(0,rawTotal-1500),unknown,skills};
 });
 const sum=key=>entries.every(e=>e[key]!==null)?entries.reduce((n,e)=>n+e[key],0):null;
 const total=sum('current'),available=sum('transferable');
 return '<section class="card"><h3>무학 수련치 · 6계열</h3><p class="micro">산부진 원본 무학 882개 및 수련 비율표를 이용합니다. 각 계열의 현재 적용 상한은 1500점이며 검왕각·극락곡 대련은 전환에서 제외합니다. 판별 불가능한 무학은 수치를 추정하지 않습니다.</p>'+
 '<div class="wiki-detail-fields"><div class="wiki-field"><span>현재 총수련치</span><b>'+fmt(total)+'</b></div><div class="wiki-field"><span>전환 가능한 추가 수련치</span><b>'+fmt(available)+'</b></div></div>'+
 '<table class="module-table"><thead><tr><th>계열</th><th>무학</th><th>추가 잔액</th><th>적용 / 1500</th><th>전환 가능</th></tr></thead><tbody>'+
 entries.map(x=>'<tr><td>'+escape(x.name)+'</td><td>'+fmt(x.learned)+'</td><td>'+fmt(x.extra)+'</td><td>'+fmt(x.current)+(x.overflow>0?' (초과 '+x.overflow+')':'')+'</td><td>'+fmt(x.transferable)+'</td></tr>').join('')+
 '</tbody></table>'+
 entries.map(x=>'<details><summary>'+escape(x.name)+' · 학습 무학 '+x.skills.length+'개'+(x.unknown?' · 미판별 '+x.unknown+'개':'')+'</summary>'+
 (x.skills.length?'<table class="module-table"><thead><tr><th>무학</th><th>복사 무학</th><th>수련치</th></tr></thead><tbody>'+x.skills.map(k=>'<tr><td>'+escape(skillName(k.id))+' <small>#'+escape(k.id)+'</small></td><td>'+(k.copiedId?escape(skillName(k.copiedId))+' <small>#'+escape(k.copiedId)+'</small>':'—')+'</td><td>'+fmt(k.current)+'</td></tr>').join('')+'</tbody></table>':'<p class="micro">기록된 무학이 없습니다.</p>')+'</details>').join('')+
 '<p class="micro">전환 시 받는 인물의 잔여 수련 상한도 적용됩니다. 원본 무학 자료가 없거나 불완전하면 계산 대신 — 표시합니다.</p></section>';
}

 const obj=Array.isArray(save)?save[0]:save||{};
 const root=obj.globalVariable||obj.GlobalVariable||obj.P;
 if(!root||typeof root!=='object')return {items:[],available:false};

 const main=role?.type==='주인공';
 const find=key=>{
  const value=Array.isArray(root)?root.find(x=>String(x?.ID??x?.Id??x?.Key??x?.key)===String(key)):root[key];
  if(value===undefined)return 0;
  const raw=value&&typeof value==='object'?value.value??value.Value??value.val??value.Val:value;
  const n=Number(raw);
  return raw==null||!Number.isFinite(n)?null:n;
 };

// Account-wide read-only overview: role cultivation and permanent growth, shared values counted once.
function yyRoleCultivationModel(role){
 const kinds=[['1','권법'],['2','도법'],['3','검법'],['4','창·곤'],['ng','내공'],['qg','경공']];
 const raw=role?.raw||{},api=window.RoleStatusData;
 let checked=null;
 if(api&&typeof api.cultivation==='function')try{
  checked=api.cultivation(save,raw,role.type==='주인공'?'主角':'随从')?.cultivation;
 }catch(err){checked=null}
 const records=kinds.map(([id,name])=>{
  const extra=Number(raw['WXXW'+id]);
  const matched=checked?.records?.find(x=>String(x.kind)===id);
  const known=Number.isFinite(extra),current=matched?.current,transfer=matched?.transferable;
  return {id,name,extra:known?extra:null,
    current:Number.isFinite(current)?current:null,
    learned:Number.isFinite(matched?.learned)?matched.learned:null,
    transferable:Number.isFinite(transfer)?transfer:null,
    fixed:Number.isFinite(matched?.fixed)?matched.fixed:null,
    raw:Number.isFinite(matched?.raw)?matched.raw:null,
    overflow:Number.isFinite(matched?.overflow)?matched.overflow:null,
    history:(matched?.history||[]).filter(x=>Number.isFinite(x.current)&&x.current>0).map(x=>({
     name:String(x.name).replace('恒山教习','항산파 교습').replace('紫阳书院指点','자양서원 지도'),
     value:x.current
    })),
    unknown:matched?.unknownSkills?.length||0,
    unknownSkills:Array.isArray(matched?.unknownSkills)?matched.unknownSkills.map(String):[],
    skills:Array.isArray(matched?.skills)?matched.skills.map(k=>({id:k.id,copyId:k.copiedName?Number(k.copyId||0):0,level:k.level,chong:k.chong,current:Number.isFinite(k.current)?k.current:null,copiedName:k.copiedName||''})):[]};
 });
 return {records,total:records.every(x=>x.current!==null)?records.reduce((v,x)=>v+x.current,0):null,
   savedExtra:records.every(x=>x.extra!==null)?records.reduce((v,x)=>v+x.extra,0):null,
   transferable:records.every(x=>x.transferable!==null)?records.reduce((v,x)=>v+x.transferable,0):null};
}
// 독립 교차 검사: 산부진의 수련 함수 호출 없이 동일 단계표로 무학 기여분을 다시 계산한다.
// 클라이언트 원본 수치 자체의 검증이 아니라 코드/매핑 오류 탐지용이다.
function yyIndependentCultivation(role){
 const raw=role?.raw||{},data=window.KONGFU_DATA||{};
 const kinds=[['1','Taolus','taolu',1],['2','Taolus','taolu',2],
  ['3','Taolus','taolu',3],['4','Taolus','taolu',4],
  ['ng','Neis','nei',null],['qg','Qings','qing',null]];
 return kinds.map(([id,field,sourceKind,weaponType])=>{
  const rows=characterEntries(raw[field]).filter(x=>x&&Number(x.ID)>0);
  let sum=0,recognized=0,unknown=0,details=[];
  for(const row of rows){
   const base=data[sourceKind]?.[String(row.ID)];
   const copyId=sourceKind==='taolu'?Number(row.CopyID||0):0;
   const cfg=copyId>0?data.taolu?.[String(copyId)]:base;
   // 복제 무학의 계열은 복제 원본의 종류를 따른다.
   if(sourceKind==='taolu'&&cfg&&Number(cfg.type)!==weaponType)continue;
   if(!cfg||sourceKind==='taolu'&&!Number.isFinite(Number(cfg.type))){unknown++;details.push({id:row.ID,copyId,value:null});continue}
   const chong=Number(row.Chong),level=Number(row.Level),grade=Number(cfg.grade),baseValue=Number(cfg.wxxw??0);
   const index=(chong-1)*4+level+1;
   const rate=data.rate?.[String(index)]?.['kf_'+Math.min(5,Math.max(1,grade))];
   if(!Number.isFinite(chong)||!Number.isFinite(level)||!Number.isFinite(grade)||
      !Number.isFinite(baseValue)||rate===undefined||!Number.isFinite(Number(rate))){
    unknown++;details.push({id:row.ID,copyId,value:null});continue
   }
   const value=Math.floor(baseValue*Math.min(Number(rate),1));
   sum+=value;recognized++;details.push({id:row.ID,copyId,value});
  }
  const extraValue=raw['WXXW'+id],extra=extraValue==null?null:Number(extraValue);
  return {id,learned:unknown===0?sum:null,recognized,unknown,details,
   extra:extra!==null&&Number.isFinite(extra)?extra:null,
   current:unknown===0&&extra!==null&&Number.isFinite(extra)?Math.min(1500,extra+sum):null};
 });
}
function yyCultivationCrossCheck(role){
 const independent=yyIndependentCultivation(role),source=yyRoleCultivationModel(role);
 return independent.map(item=>{
  const original=source.records.find(x=>x.id===item.id);
  const comparable=item.learned!==null&&original?.learned!==null&&item.current!==null&&original?.current!==null;
  const mismatch=comparable&&(item.learned!==original.learned||item.current!==original.current);
  const unverified=!comparable||item.unknown>0||original?.unknown>0;
  return {...item,originalLearned:original?.learned??null,originalCurrent:original?.current??null,
   mismatch,unverified};
 });
}

function yyProgressStat(model){
 let filled=0,total=0,started=0,complete=0,unknown=0;
 for(const item of model?.items||[]){
  if(item.values.some(v=>v.current===null)){unknown++;continue}
  const exists=item.values.some(v=>v.current>0);
  const done=item.values.length>0&&item.values.every(v=>v.current>=v.max);
  if(exists)started++;
  if(done)complete++;
  for(const v of item.values){filled+=v.current;total+=v.max}
 }
 return {filled,total,started,complete,unknown};
}

function yyCultivationAudit(entries){
 const missing=new Map(),source=window.KONGFU_DATA||{};
 const categories=[['Taolus','taolu'],['Neis','nei'],['Qings','qing']];
 for(const {r,stats} of entries){
  for(const [field,kind] of categories){
   const rows=characterEntries(r.raw?.[field]);
   for(const skill of rows){
    if(!skill||Number(skill.ID)<=0)continue;
    const id=String(skill.ID),copyId=Number(skill.CopyID||0);
    const base=source[kind]?.[id],copy=copyId>0&&kind==='taolu'?source.taolu?.[String(copyId)]:null;
    const cfg=copyId>0&&kind==='taolu'?copy:base;
    const issues=[];
    if(!base)issues.push('기본 무학 ID 미연결');
    if(copyId>0&&kind==='taolu'&&!copy)issues.push('복제 무학 ID 미연결');
    if(cfg&&(!Number.isFinite(Number(cfg.grade))||!Number.isFinite(Number(cfg.wxxw))))issues.push('수련 기준 누락');
    if(cfg&&kind==='taolu'&&!Number.isFinite(Number(cfg.type)))issues.push('무기 계열 누락');
    if(cfg&&Number.isFinite(Number(skill.Level))&&Number.isFinite(Number(skill.Chong))){
     const rateIndex=(Number(skill.Chong)-1)*4+Number(skill.Level)+1;
     const grade=Math.min(5,Math.max(1,Number(cfg.grade)));
     const rate=source.rate?.[String(rateIndex)]?.['kf_'+grade];
     if(!Number.isFinite(Number(rate)))issues.push('정진·수련 단계율 누락');
    }
    const level=Number(skill.Level),chong=Number(skill.Chong);
    if(!Number.isFinite(level)||!Number.isFinite(chong))issues.push('수련 단계 저장값 누락');
    if(!issues.length)continue;
    const key=field+':'+id+':'+copyId+':'+issues.join(',');
    const item=missing.get(key)||{id,copyId,field,issues,count:0,roles:[]};
    item.count++;
    item.roles.push(r.name);
    missing.set(key,item);
   }
  }
  // Include source evaluator failures which may not be apparent from the table alone.
  for(const track of stats.records){
   for(const unknownId of track.unknownSkills||[]){
    if(unknownId==='未识别记录')continue;
    const id=String(unknownId);
    const key='source:'+track.id+':'+id;
    if(!missing.has(key))missing.set(key,{id,copyId:0,field:track.name,
     issues:['원본 수련 단계표에서 계열 판정 실패'],count:1,roles:[r.name]});
   }
  }
 }
 return [...missing.values()].sort((a,b)=>b.count-a.count||a.id.localeCompare(b.id));
}

function yyAccountCultivationCsv(){
 const table=[['캐릭터','인물 ID','구분','레벨','계열','저장 추가 수련','무학 습득 수련','현재 수련','고정 수련','이전 가능 수련','상한 초과','누락 무학 ID 개수']];
 for(const r of roles){
  const m=yyRoleCultivationModel(r);
  for(const x of m.records)table.push([r.name,r.id,r.type,r.level??'',x.name,x.extra,x.learned,x.current,x.fixed,x.transferable,x.overflow,x.unknown]);
 }
 const cross=[['캐릭터','인물 ID','계열','독립 무학 수련치','원본 무학 수련치','독립 현재 수련치','원본 현재 수련치','비교 결과']];
 for(const r of roles)for(const x of yyCultivationCrossCheck(r))
  cross.push([r.name,r.id,x.id,x.learned,x.originalLearned,x.current,x.originalCurrent,
   x.mismatch?'불일치':x.unverified?'미확인':'일치']);
 const martial=[['캐릭터','인물 ID','계열','무학 이름','무학 ID','정진','수련 단계','수련치 기여분','복제 무학 기록']];
 for(const r of roles){
  const m=yyRoleCultivationModel(r);
  for(const x of m.records){
   for(const skill of x.skills){
    const info=(window.NANGMAN_54506_MARTIAL_KO||{})[String(skill.id)];
    const name=Array.isArray(info)&&info[0]&&!wikiHasChinese(info[0])?info[0]:'무학 #'+skill.id;
    martial.push([r.name,r.id,x.name,name,skill.id,skill.chong,skill.level,skill.current,skill.copiedName?'복제 무학':'']);
   }
  }
 }
 const permanent=[['캐릭터','인물 ID','구분','수련 또는 단약','항목','능력치','현재 기록','상한','확인 상태']];
 for(const r of roles){
  for(const [key,name] of [['training','수련'],['consumable','단약']]){
   const model=yyProgressEntries(save,r,key);
   for(const group of model.items){
    for(const item of group.values)permanent.push([r.name,r.id,r.type,name,group.title,item.label,
     item.current,item.max,item.current===null?'미확인':item.current===item.max?'완료':item.current>0?'진행 중':'미시작']);
   }
  }
 }
 const main=roles.find(x=>x.type==='주인공')||roles[0];
 if(main){
  const shared=yyProgressEntries(save,main,'other');
  for(const group of shared.items)for(const item of group.values)
   permanent.push(['계정 공유','','공유','기타',group.title,item.label,item.current,item.max,item.current===null?'미확인':'공유 기록']);
 }
 const history=[['획득 인물','계열','획득 출처','과거 획득 누적']];
 for(const r of roles){
  const m=yyRoleCultivationModel(r);
  for(const x of m.records)for(const h of x.history)history.push([r.name,x.name,h.name,h.value]);
 }
 const format=v=>v===null||v===undefined?'':String(v);
 const csvRow=row=>row.map(v=>'"'+format(v).replace(/"/g,'""')+'"').join(',');
 return '\uFEFF'+'# 계정 전체 수련치 · 현재 저장값 (6계열, 인물별)\r\n'+
 table.map(csvRow).join('\r\n')+
 '\r\n\r\n# 무학별 수련 기여 기록 (캐릭터별 정진 및 수련 단계)\r\n'+
 martial.map(csvRow).join('\r\n')+
 '\r\n\r\n# 6계열 수련 독립 교차 검사 (원본 단계표 일치 확인)\r\n'+
 cross.map(csvRow).join('\r\n')+
 '\r\n\r\n# 계정 전체 수련 및 영구 단약 진행도 (0회 포함)\r\n'+
 permanent.map(csvRow).join('\r\n')+
 '\r\n\r\n# 과거 획득 기록 (현재 수련치와 합산하지 않음)\r\n'+
 history.map(csvRow).join('\r\n')+'\r\n';
}

      let key=n.tagName.toLowerCase();
      if(n.id){key+='#'+n.id;parts.unshift(key);break;}
      const cls=String(n.className||'').trim().split(/\s+/).filter(Boolean)[0];
      if(cls)key+='.'+cls.replace(/[^\w-]/g,'');

      if(p){const peers=Array.from(p.children).filter(c=>c.tagName===n.tagName);if(peers.length>1)key+=':nth-of-type('+(peers.indexOf(n)+1)+')';}

      if(value&&hanja.test(value))out.push({scope,type:'text',value:value.slice(0,240),path:pathOf(el),hidden:!isVisible(el)});
    }
    doc.querySelectorAll('[placeholder],[title],[aria-label],input[value],option,textarea').forEach(el=>{
      if(!includeHidden&&!isVisible(el)&&el.tagName!=='OPTION')return;
      const attrs=['placeholder','title','aria-label'];
      if(el.matches('input[value]'))attrs.push('value');
      if(el.tagName==='OPTION')attrs.push('textContent');
      if(el.tagName==='TEXTAREA')attrs.push('value');
      for(const attr of attrs){
        const value=(attr==='textContent'?el.textContent:attr==='value'&&el.tagName==='TEXTAREA'?el.value:el.getAttribute(attr))||'';
        if(hanja.test(value))out.push({scope,type:attr,value:value.trim().slice(0,240),path:pathOf(el),hidden:!isVisible(el)});
      }
    });
    doc.querySelectorAll('iframe').forEach((frame,i)=>{
      if(!includeHidden&&!isVisible(frame))return;
      try{if(frame.contentDocument)collect(frame.contentDocument,scope+' / '+(frame.title||frame.id||'프레임 '+(i+1)),out,includeHidden);}
      catch(error){out.push({scope,type:'접근 불가',value:String(error.message||error),path:pathOf(frame),hidden:!isVisible(frame)});}
    });
  }
  function scan(options){
    const includeHidden=options===true||!!(options&&options.includeHidden);
    const matches=[];
    collect(document,'통합 화면',matches,includeHidden);
    const grouped=Object.values(matches.reduce((out,item)=>{
      const key=[item.scope,item.type,item.value,item.path,item.hidden].join('|');
      if(!out[key])out[key]={...item,count:0};
      out[key].count++;
      return out;
    },{}));
    console.table(grouped);
    return {total:matches.length,unique:grouped.length,includeHidden,results:grouped};
  }
  window.NangmanFullTranslationAudit={scan,scanAll(){return scan({includeHidden:true});}};
})();
</script>
