name: Internal four-gate replay research
on:
  push:
    branches:
      - research/four-gate-internal-20261125
  workflow_dispatch:
jobs:
  source-model-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure no real account saves or account-derived seeds
        run: node scripts/check-public-privacy.cjs
      - name: Verify mixed four-gate interleaved original-model RNG
        run: node research/dungeon-lab/test-mixed-four-gate.cjs
      - name: Verify all 26 extracted game source tables
        run: node research/dungeon-lab/test-source-26-tables.cjs
      - name: Verify conditional level-70 7209 source hypothesis without user saves
        run: node research/dungeon-lab/test-mask-7209-conditional.cjs
      - name: Cross-check alternative 7209-only draw model against field RNG implementation
        run: node research/mask-drop/test-conditional-forecast.cjs
      - name: Verify level-70 before/after RNG lane observer (synthetic)
        run: node research/mask-drop/test-compare-battle-lane.cjs
      - name: Verify level-70 continuous battle timeline and private-safe output
        run: node research/mask-drop/test-calibrate-level70.cjs
      - name: Verify source-conditional weight-model pruning (synthetic only)
        run: node research/mask-drop/test-validate-weight-hypotheses.cjs
      - name: Verify base four-gate source-consumer model
        run: node tests/dungeon-success-synthetic.cjs
