name: Equipment, quests and character feature checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'engine/equipment-detail-bridge.js'
      - 'engine/quest-branch.js'
      - 'vendor/sanbujin/equip/**'
      - 'vendor/sanbujin/drops/**'
      - 'vendor/nangman-v350/**'
      - 'vendor/sanbujin/equip-auto/**'
      - 'tests/equipment-detail-bridge-smoke.cjs'
      - 'tests/nangman-v350-equipment-smoke.cjs'
      - 'tests/wiki-icon-structure.cjs'
      - 'tests/wiki-icon-mapping-smoke.cjs'
      - 'tests/drop-boss-removal-smoke.cjs'
      - 'tests/dungeon-boss-probability-smoke.cjs'
      - 'tests/dungeon-yysim-rng-parity.cjs'
      - 'tests/dungeon-dual-forecast-smoke.cjs'
      - 'tests/dungeon-one-time-ownership-smoke.cjs'
      - 'tests/dungeon-v2-audit-smoke.cjs'
      - 'vendor/yysim/daily_data.js'
      - 'tests/quest-branch-smoke.cjs'
      - 'tests/character-source-smoke.cjs'
      - 'tests/character-layout-smoke.cjs'
      - 'tests/account-record-resources-smoke.cjs'
      - 'tests/account-growth-counts-smoke.cjs'
      - 'tests/map-loot-catalog-smoke.cjs'
      - 'data/map-loot-60014.js'
      - 'tests/html-inline-syntax.cjs'
      - '.github/workflows/feature-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit original wiki craft and arts icon fields
        run: node tests/wiki-icon-structure.cjs
      - name: Check verified craft, secret-art and buff image URLs
        run: node tests/wiki-icon-mapping-smoke.cjs
      - name: Verify removed whole-boss comparison does not break dungeon UI
        run: node tests/drop-boss-removal-smoke.cjs
      - name: Verify yy-sim dungeon probabilities and Korean names
        run: |
          node tests/dungeon-boss-probability-smoke.cjs
          node tests/dungeon-yysim-rng-parity.cjs
          node tests/dungeon-dual-forecast-smoke.cjs
          node tests/dungeon-one-time-ownership-smoke.cjs
          node tests/dungeon-v2-audit-smoke.cjs
      - name: Character stat source
        run: node tests/character-source-smoke.cjs
      - name: Character page layout
        run: node tests/character-layout-smoke.cjs
      - name: Account-wide Jianghu and map resource save data
        run: node tests/account-record-resources-smoke.cjs
      - name: Verify complete Korean map-resource catalogue
        run: node tests/map-loot-catalog-smoke.cjs
      - name: Person and account numerical growth records
        run: node tests/account-growth-counts-smoke.cjs
      - name: Korean quest branch state
        run: node tests/quest-branch-smoke.cjs
      - name: Equipment sequence and save identity
        run: node tests/equipment-detail-bridge-smoke.cjs
      - name: Native NangmanSimulator v3.50 equipment engine
        run: node tests/nangman-v350-equipment-smoke.cjs
      - name: Static script syntax
        run: node tests/html-inline-syntax.cjs
