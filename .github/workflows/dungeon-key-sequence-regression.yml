name: Dungeon key and repeat sequence regression
on:
  push:
    branches: [main]
    paths:
      - 'vendor/sanbujin/drops/dungeon-core.js'
      - 'vendor/sanbujin/drops/dungeon-v2-audit.js'
      - 'vendor/sanbujin/drops/dungeon-orange.js'
      - 'vendor/sanbujin/drops/dungeon-v3-inverse.js'
      - 'tests/dungeon-v2-audit-smoke.cjs'
      - 'tests/dungeon-gori-key-rng-smoke.cjs'
      - 'tests/dungeon-native-repeat-parity.cjs'
      - 'tests/dungeon-v3-inverse-smoke.cjs'
      - '.github/workflows/dungeon-key-sequence-regression.yml'
  workflow_dispatch:
jobs:
  dungeon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source/native regression
        run: node tests/dungeon-v2-audit-smoke.cjs
      - name: Gori key and repeated dungeon sequence regression
        run: node tests/dungeon-gori-key-rng-smoke.cjs
      - name: Three-clear native core and audit parity
        run: node tests/dungeon-native-repeat-parity.cjs
      - name: Measurement inverse regression
        run: node tests/dungeon-v3-inverse-smoke.cjs
