name: Wash v3.50 + Intermediate meridian checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'engine/yysim-*'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/nangman-v350/wash.html'
      - 'tests/yysim-*-smoke.cjs'
      - 'tests/v350-wash-source-bridge-smoke.cjs'
      - 'tests/wash-ui-theme-regression.cjs'
      - 'tests/yysim-real-wasm-boot-smoke.cjs'
      - 'tests/yysim-wasm-restoration-probe.cjs'
      - 'tests/yysim-native-exchange-probe.cjs'
      - '.github/workflows/wash-v350-intermediate.yml'
  workflow_dispatch:
jobs:
  wash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual yy-sim embedded WASM initialization
        run: node tests/yysim-real-wasm-boot-smoke.cjs
      - name: Native WASM restoration probe
        run: node tests/yysim-wasm-restoration-probe.cjs
      - name: Native exchange event investigation
        run: node tests/yysim-native-exchange-probe.cjs
      - name: Intermediate goal and rollback
        run: node tests/yysim-intermediate-search-smoke.cjs
      - name: Native exchange beam 3-purple and green final result
        run: node tests/yysim-exchange-beam-smoke.cjs
      - name: Original yy-sim automatic route adapter
        run: node tests/yysim-auto-search-smoke.cjs
      - name: Native v3.50 wash source and bridge
        run: node tests/v350-wash-source-bridge-smoke.cjs
      - name: Wash UI and colored target selectors
        run: node tests/wash-ui-theme-regression.cjs
