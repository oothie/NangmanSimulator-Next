name: yy-sim real browser auto-search
on:
  push:
    branches: [main]
    paths:
      - 'engine/local-engine-bridge.js'
      - 'engine/yysim-intermediate-search.js'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/yysim/core_glue.js'
      - 'tests/yysim-browser-boot.cjs'
      - '.github/workflows/yysim-browser-auto.yml'
  workflow_dispatch:
jobs:
  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Chromium WASM iframe green and blue smoke
        run: node tests/yysim-browser-boot.cjs
