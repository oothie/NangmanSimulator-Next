name: yy-sim real browser auto-search
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'engine/local-engine-bridge.js'
      - 'engine/yysim-auto-progressive.js'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/yysim/core_glue.js'
      - 'tests/yysim-native-only-browser.cjs'
      - 'tests/yysim-native-grade-contract.cjs'
      - 'tests/yysim-native-grade-mutation-probe.cjs'
      - 'tests/yysim-native-single-pass.cjs'
      - 'tests/yysim-wasm-route-audit.cjs'
      - 'tests/yysim-wasm-callgraph.cjs'
      - 'tests/yysim-wasm-request-schema.cjs'
      - '.github/workflows/yysim-browser-auto.yml'
  workflow_dispatch:
jobs:
  browser-wasm:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
      - name: Original native WASM route export inspection
        run: node tests/yysim-wasm-route-audit.cjs
      - name: Original WASM request metadata contract
        run: node tests/yysim-wasm-request-schema.cjs
      - name: Original route solver opcode callgraph
        run: node tests/yysim-wasm-callgraph.cjs
      - name: Native route single-call contract
        run: node tests/yysim-native-single-pass.cjs
      - name: Chromium original yy-sim WASM auto-search regression
        run: node tests/yysim-native-only-browser.cjs
      - name: Original WASM grade contract diagnostic
        run: node tests/yysim-native-grade-contract.cjs
      - name: Isolated native WASM talent grade gate probe
        run: node tests/yysim-native-grade-mutation-probe.cjs
