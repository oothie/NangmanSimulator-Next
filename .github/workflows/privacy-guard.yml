name: Public artifact privacy guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject private save artifacts
        run: node scripts/check-public-privacy.cjs
      - name: Verify synthetic ghost-market RNG
        run: node tests/market-strategy-synthetic.cjs
      - name: Verify old-save assumed automatic refreshes
        run: node tests/market-assumed-free-synthetic.cjs
      - name: Verify dungeon source-derived success-only consumer
        run: node tests/dungeon-success-synthetic.cjs
