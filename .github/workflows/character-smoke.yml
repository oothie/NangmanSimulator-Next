name: Character regression checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/sanbujin/drops/**'
      - 'tests/**'
      - '.github/workflows/character-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/sanbujin/drops/**'
      - 'tests/**'
      - '.github/workflows/character-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate character source regression
        run: node tests/character-source-smoke.cjs
      - name: Validate yy-sim role page and saved progress
        run: node tests/character-layout-smoke.cjs
      - name: Compare independent six-track cultivation with source
        run: node tests/cultivation-crosscheck.cjs
      - name: Validate wash, quest and drop module integration
        run: node tests/module-integration-smoke.cjs
      - name: Validate workflow data quality and save synchronization
        run: node tests/workflow-integration-smoke.cjs
      - name: Verify seeded ghost market prediction parity
        run: node tests/daily-market-smoke.cjs
      - name: Verify full Korean mission Branch ledger
        run: node tests/quest-branch-smoke.cjs
      - name: Verify Diling 100-level field 90-equipment drop integration
        run: node tests/tomb-field-smoke.cjs
