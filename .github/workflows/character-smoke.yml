name: Character regression checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/sanbujin/drops/**'
      - 'tests/**'
      - '.github/workflows/character-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'vendor/yysim/engine-host.html'
      - 'vendor/sanbujin/drops/**'
      - 'tests/**'
      - '.github/workflows/character-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate character source regression
        run: node tests/character-source-smoke.cjs
      - name: Validate yy-sim role page and saved progress
        run: node tests/character-layout-smoke.cjs
      - name: Compare independent six-track cultivation with source
        run: node tests/cultivation-crosscheck.cjs
      - name: Validate wash, quest and drop module integration
        run: node tests/module-integration-smoke.cjs
      - name: Validate workflow data quality and save synchronization
        run: node tests/workflow-integration-smoke.cjs
      - name: Verify seeded ghost market prediction parity
        run: node tests/daily-market-smoke.cjs
      - name: Verify full Korean mission Branch ledger
        run: node tests/quest-branch-smoke.cjs
      - name: Verify Diling 100-level field 90-equipment drop integration
        run: node tests/tomb-field-smoke.cjs
      - name: Verify Diling two-save RNG hypothesis comparison
        run: node tests/tomb-compare-smoke.cjs
      - name: Compare Diling source v29 RNG independently
        run: node tests/tomb-source-parity.cjs
      - name: Verify native wash target path and undo bridge
        run: node tests/wash-target-path-smoke.cjs
      - name: Validate native wash lock and exchange controls
        run: node tests/wash-slot-controls.cjs
      - name: Verify native wash conflict inspection and removed A/B tool
        run: node tests/wash-constraints-smoke.cjs
      - name: Validate real embedded yy-sim WASM output shapes
        run: node tests/wasm-runtime-integration.cjs
      - name: Verify actual WASM wash and exchange result semantics
        run: node tests/wasm-native-actions-runtime.cjs
      - name: Verify real WASM end-to-end host commands
        run: node tests/wash-host-real-wasm.cjs
      - name: Test next native wash collision automation and rollback
        run: node tests/wash-until-exchange-smoke.cjs
      - name: Verify 1–4 stage native wash and exchange transaction
        run: node tests/wash-chain-smoke.cjs
      - name: Verify goal-only Domakbeop talent inventory audit
        run: node tests/wash-goal-audit-smoke.cjs
      - name: Verify original WASM goal-only three-slot lock
        run: node tests/wash-goal-lock-smoke.cjs
      - name: Compile integrated simulator and embedded native HTML scripts
        run: node tests/html-inline-syntax.cjs
      - name: Verify native purple path goal and cost sorting
        run: node tests/wash-path-model-smoke.cjs
      - name: Verify native WASM purple sequence metadata and export
        run: node tests/wash-preview-model-smoke.cjs
      - name: Verify native wash conflict slot mapping
        run: node tests/wash-conflict-model-smoke.cjs
      - name: Verify purple equipment result filters
        run: node tests/drop-quality-filter-smoke.cjs
      - name: Verify 90-level field/dungeon shared per-item receipt sequence
        run: node tests/shared-gear-sequence-smoke.cjs
      - name: Audit Korean 90-level gear source pools and tomb 100-to-90 behavior
        run: node tests/drop-90-catalog-parity.cjs
      - name: Verify exported wild and dungeon drop CSV
        run: node tests/drop-csv-smoke.cjs
