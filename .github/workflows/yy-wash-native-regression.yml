name: yy-sim WASM native wash regression

on:
  push:
    paths:
      - 'engine/yysim-auto-search.js'
      - 'engine/yysim-auto-progressive.js'
      - 'engine/yysim-native-search-guard.js'
      - 'vendor/yysim/engine-host.html'
      - 'tests/yysim-native-search-guard-smoke.cjs'
      - 'vendor/yysim/wasm_data.js'
      - 'tests/yysim-auto-search-smoke.cjs'
      - 'tests/yysim-grade-catalog-contract.cjs'
      - 'tests/yysim-native-headless-grade.cjs'
      - 'tests/yysim-native-live-probe.html'
      - 'tests/yysim-native-live-probe-smoke.cjs'
      - 'engine/yysim-save-state.js'
      - 'tests/yysim-native-save-probe.js'
      - 'tests/yysim-native-save-state-smoke.cjs'
      - 'tests/yysim-native-mixed-dispatch-smoke.cjs'
      - 'engine/yysim-target-catalog.js'
      - 'vendor/yysim/data.js'
      - 'tests/yysim-auto-progressive-smoke.cjs'
      - 'tests/yysim-wasm-callgraph.cjs'
      - 'index.html'
      - '.github/workflows/yy-wash-native-regression.yml'
  pull_request:
    paths:
      - 'engine/yysim-auto-search.js'
      - 'engine/yysim-auto-progressive.js'
      - 'engine/yysim-native-search-guard.js'
      - 'vendor/yysim/engine-host.html'
      - 'tests/yysim-native-search-guard-smoke.cjs'
      - 'vendor/yysim/wasm_data.js'
      - 'tests/yysim-auto-search-smoke.cjs'
      - 'tests/yysim-grade-catalog-contract.cjs'
      - 'tests/yysim-native-headless-grade.cjs'
      - 'tests/yysim-native-live-probe.html'
      - 'tests/yysim-native-live-probe-smoke.cjs'
      - 'engine/yysim-save-state.js'
      - 'tests/yysim-native-save-probe.js'
      - 'tests/yysim-native-save-state-smoke.cjs'
      - 'tests/yysim-native-mixed-dispatch-smoke.cjs'
      - 'engine/yysim-target-catalog.js'
      - 'vendor/yysim/data.js'
      - 'tests/yysim-auto-progressive-smoke.cjs'
      - 'tests/yysim-wasm-callgraph.cjs'
      - 'index.html'
      - '.github/workflows/yy-wash-native-regression.yml'
  workflow_dispatch:

jobs:
  native-wash-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check engine/yysim-auto-search.js
          node --check engine/yysim-auto-progressive.js
          node --check engine/yysim-native-search-guard.js
          node --check tests/yysim-native-search-guard-smoke.cjs
          node --check tests/yysim-auto-progressive-smoke.cjs
          node --check tests/yysim-wasm-callgraph.cjs
          node --check tests/yysim-native-grade-contract.cjs
          node --check tests/yysim-grade-catalog-contract.cjs
          node --check tests/yysim-native-headless-grade.cjs
          node --check tests/yysim-native-live-probe-smoke.cjs
          node --check engine/yysim-save-state.js
          node --check tests/yysim-native-save-probe.js
          node --check tests/yysim-native-save-state-smoke.cjs
          node --check tests/yysim-native-mixed-dispatch-smoke.cjs
      - name: Verify original WASM state restore on native errors
        run: node tests/yysim-native-search-guard-smoke.cjs
      - name: Validate native talent IDs and grades before mixed search
        run: node tests/yysim-grade-catalog-contract.cjs
      - name: Verify original WASM host accepts mixed grades and rejects incomplete final slots
        run: node tests/yysim-native-mixed-dispatch-smoke.cjs
      - name: Verify real-save character mapping and independent seeds
        run: node tests/yysim-native-save-state-smoke.cjs
      - name: Verify browser-native live probe remains original-WASM only
        run: node tests/yysim-native-live-probe-smoke.cjs
      - name: Execute original WASM in Node and classify mixed-grade outcomes
        run: |
          set -o pipefail
          node tests/yysim-native-headless-grade.cjs 2>&1 | tee native-grade-report.txt
      - name: Retain original WASM grade diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-wasm-mixed-grade-diagnostic
          path: native-grade-report.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Verify native single-call final-route minimum and UI
        run: node tests/yysim-auto-progressive-smoke.cjs
      - name: Verify original results adapter and final-slot goals
        run: node tests/yysim-auto-search-smoke.cjs
      - name: Verify original WASM native call graph
        run: node tests/yysim-wasm-callgraph.cjs
