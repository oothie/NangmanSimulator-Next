name: Internal lower-gate equipment evidence regression
on:
  push:
    branches:
      - research/dungeon-rng-original
  workflow_dispatch:
jobs:
  low-gate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard public repository privacy
        run: node research/dungeon-rng/low_gates/check_research_privacy.cjs
      - name: Source-confirmed six lower-gate equipment evidence without false attribution
        run: |
          node research/dungeon-rng/low_gates/test_after_save_equipment_evidence.cjs
          node research/dungeon-rng/low_gates/test_sealed_low_gate_equipment.cjs
          node research/dungeon-rng/low_gates/test_run_lower_gate_save_pair.cjs
          node research/dungeon-rng/low_gates/test_audit_40_table_synthetic_key.cjs
          node research/dungeon-rng/low_gates/test_audit_40_table_metadata_positions.cjs
          node research/dungeon-rng/low_gates/test_audit_40_table_equipment_effects.cjs
          node research/dungeon-rng/low_gates/test_gate_table_order_preflight.cjs
