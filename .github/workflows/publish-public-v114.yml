name: Publish sanitized v1.1.4 static site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'engine/**'
      - 'shared/**'
      - 'i18n/**'
      - 'vendor/**'
      - 'icons/**'
      - 'scripts/build-public-v114.cjs'
      - '.github/workflows/publish-public-v114.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-site-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble privacy-filtered public static site
        run: node scripts/build-public-v114.cjs
      - name: Validate no uploaded saves or test records are included
        run: |
          node - <<'JS'
          const fs=require('fs'),path=require('path');
          function walk(dir){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
            const p=path.join(dir,ent.name);
            if(ent.isDirectory())walk(p);
            else if(/(?:save|fixture|reference-saves|checkpoints|tests)\.(?:json|js)$/i.test(p))
              throw Error('Unexpected published fixture: '+p);
          }}
          walk('dist-public');
          if(!fs.existsSync('dist-public/index.html'))throw Error('Missing HTML entry');
          console.log('Public artifact privacy gate passed');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
