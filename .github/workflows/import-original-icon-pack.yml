name: Install Korean game icons
on:
  push:
    branches: [main]
    paths:
      - 'NangmanSimulator_Original_Icons_60014.zip'
      - '.github/workflows/import-original-icon-pack.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: original-korean-icon-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified Korean icons
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import re
          import zipfile
          from pathlib import Path

          PNG=b'\x89PNG\r\n\x1a\n'
          installed=0
          # Already extracted Korean icon sprites are present in the repository.
          # Turn the previously bundled data URIs into actual same-origin PNGs.
          for group in ('buff','skill'):
              for src in sorted(Path('data').glob('wiki-'+group+'-icons-*.js')):
                  raw=src.read_text(encoding='utf-8')
                  matches=re.findall(r'"(icon_'+group+r'_[A-Za-z0-9_-]+)":"data:image/png;base64,([A-Za-z0-9+/=]+)"',raw)
                  for key,packed in matches:
                      payload=base64.b64decode(packed,validate=True)
                      if not payload.startswith(PNG):continue
                      suffix=key.split('icon_'+group+'_',1)[1]
                      filename=(suffix if group=='skill' else key)+'.png'
                      target=Path('icons',group,filename)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      if not target.exists() or target.read_bytes()!=payload:target.write_bytes(payload)
                      installed+=1
          archive=Path('NangmanSimulator_Original_Icons_60014.zip')
          if archive.exists():
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      name=entry.filename
                      if not re.fullmatch(r'icons/(?:item|equip|buff|skill|martial)/[a-zA-Z0-9_-]+\.(?:png|jpg|webp)',name):continue
                      payload=z.read(entry)
                      if not (payload.startswith(PNG) or payload.startswith(b'\xff\xd8\xff')):continue
                      target=Path(name)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(payload)
                      installed+=1
          if installed==0:raise SystemExit('No valid original icon files found')
          lines=['/* Existing first-party Korean game PNG icons */']
          for group,label in [('item','ITEM'),('buff','BUFF'),('skill','SKILL'),('equip','EQUIP'),('martial','MARTIAL')]:
              ids=[]
              for icon in Path('icons',group).glob('*.png'):
                  stem=icon.stem
                  if group=='buff' and stem.startswith('icon_buff_'):stem=stem[len('icon_buff_'):]
                  if stem.isdecimal():ids.append(int(stem))
              lines.append('window.NANGMAN_HOSTED_'+label+'_ICONS=new Set('+json.dumps(sorted(set(ids)))+');')
          Path('data/item-icon-manifest.js').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('Verified original icon files:',installed)
          PY
      - name: Commit self-hosted icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons data/item-icon-manifest.js
          if [ -f NangmanSimulator_Original_Icons_60014.zip ]; then git rm -f NangmanSimulator_Original_Icons_60014.zip; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install bundled Korean status and skill sprite PNGs"
          git push
