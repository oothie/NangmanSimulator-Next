<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>yy-sim 세수 엔진</title></head><body><script src="./wasm_data.js"></script><script src="./core_glue.js"></script><script src="./data.js"></script><script>
let ready=false;
function send(requestId,ok,data){parent.postMessage({kind:'yysim-wash',requestId,ok,data},location.origin)}
window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==parent)return;
const {kind,requestId,op,payload}=e.data||{};if(kind!=='nangman-engine-command')return;
try{
 if(op==='init'){if(!ready){const ok=await initWasm();if(!ok||!wasmInitEngine(TALENT_DATA,ZZ_DATA))throw Error('yy-sim 세수 WASM 초기화 실패');ready=true}send(requestId,true,{ready:true});return}
 if(!ready)throw Error('yy-sim 엔진 초기화가 필요합니다');
 if(op==='state'){send(requestId,true,wasmGetState());return}
 if(op==='set-state'){if(!wasmSetState(payload))throw Error('세수 상태 지정 실패');send(requestId,true,wasmGetState());return}
 if(op==='preview'){const count=Number(payload?.count||900);
  if(!Number.isInteger(count)||count<1||count>5000)throw Error('미리보기는 1–5000회 범위입니다');
  const preview=wasmPreviewSequence(count);
  if(!preview||typeof preview!=='object'||!Array.isArray(preview.purples))
   throw Error('원본 WASM 자맥 미리보기 결과 형식이 잘못되었습니다');
  const nameIds=Object.fromEntries(Object.entries(TALENT_DATA).filter(([,x])=>x?.name).map(([id,x])=>[x.name,id]));
  send(requestId,true,{preview,count,nameIds});
  return
 }
 if(op==='talent-constraints'){
  const before=wasmGetState();
  if(!before)throw Error('원본 세수 상태를 확인할 수 없습니다');
  const available=wasmGetAvailableTalents();
  const conflicts=wasmGetConflicts();
  const after=wasmGetState();
  if(!after||JSON.stringify(before)!==JSON.stringify(after))
   throw Error('재능 조회 중 WASM 상태가 변경됐습니다. 원본 결과를 적용하지 않습니다');
  if(!available||typeof available!=='object'||available.error||
     !conflicts||typeof conflicts!=='object'||conflicts.error)
   throw Error('원본 WASM 재능·충돌 자료 구조를 확인할 수 없습니다');
  const nameIds=Object.fromEntries(Object.entries(TALENT_DATA).filter(([,x])=>x?.name).map(([id,x])=>[x.name,id]));
  send(requestId,true,{available,conflicts,nameIds});
  return
 }
 if(op==='exchange-pads'){
  const targets=payload?.targets;
  const maxPad=Number(payload?.maxPad??900);
  if(!Array.isArray(targets)||targets.length<1||targets.length>4||
     !Number.isInteger(maxPad)||maxPad<1||maxPad>5000)
   throw Error('도맥법 목표 1~4개, 탐색 횟수 1~5000회로 설정하세요');
  const mapped=targets.map(entry=>{
   const purple=Number(entry?.purpleId),conflict=Number(entry?.conflictId);
   const a=TALENT_DATA[String(purple)],b=TALENT_DATA[String(conflict)];
   if(!Number.isInteger(purple)||!Number.isInteger(conflict)||!a?.name||!b?.name||
      a.pinzhi!==4||b.pinzhi!==4||a.name==='备用天赋'||b.name==='备用天赋')throw Error('원본 자색 재능만 선택하세요. 예비 재능은 제외됩니다');
   return {purple_name:a.name,conflict_name:b.name};
  });
  const results=wasmPreviewExchangePads(mapped,maxPad);
  if(results==null||typeof results!=='object'||results.error)
   throw Error('원본 WASM 도맥법 경로 결과를 확인할 수 없습니다');
  const nameIds=Object.fromEntries(Object.entries(TALENT_DATA).filter(([,item])=>item?.name).map(([id,item])=>[item.name,id]));
  send(requestId,true,{results,targets:mapped,maxPad,nameIds});
  return
 }
 if(op==='until-talent'){
  const id=Number(payload?.talentId),limit=Number(payload?.count??1000);
  const entry=TALENT_DATA[String(id)];
  if(!Number.isInteger(id)||!entry?.name||entry.pinzhi!==4||entry.name==='备用天赋'||
    !Number.isInteger(limit)||limit<1||limit>5000)
   throw Error('원본 자색 재능 ID와 세수 횟수 1~5000회를 입력하세요');
  const snapshot=wasmGetState();
  if(!snapshot)throw Error('원본 세수 상태를 읽지 못했습니다');
  const results=wasmWashUntilTalentName(entry.name,limit);
  const state=wasmGetState();
  if(!state||!results||typeof results!=='object'||results.error)
   throw Error('원본 목표 자맥 세수 상태·결과를 읽지 못했습니다');
  send(requestId,true,{results,state,limit,talentId:id,sourceName:entry.name});
  return
 }
 if(op==='until-exchange'){
  const limit=Number(payload?.count??500);
  const target=payload?.talentId==null?null:Number(payload.talentId);
  if(!Number.isInteger(limit)||limit<1||limit>1000)
   throw Error('다음 치환까지 모의 세수는 최대 1000회로 제한됩니다');
  if(target!=null&&(!Number.isInteger(target)||!TALENT_DATA[String(target)]||
     TALENT_DATA[String(target)].pinzhi!==4||TALENT_DATA[String(target)].name==='备用天赋'))
   throw Error('목표 자맥은 원본 자색 재능만 사용할 수 있습니다');
  const start=wasmGetState();
  if(!start)throw Error('모의 세수 시작 상태를 읽지 못했습니다');
  const outcomes=[];
  let matched=null,stopped='limit';
  try{
   for(let i=0;i<limit;i++){
    const before=wasmGetState();
    const wash=wasmDoWash();
    const current=wasmGetState();
    if(!current||!Array.isArray(current.talents))throw Error('모의 세수 진행 상태가 올바르지 않습니다');
    if(wash?.error)throw Error('원본 WASM 모의 세수 오류');
    if(JSON.stringify(before)===JSON.stringify(current)){
     stopped='unchanged';break;
    }
    outcomes.push(wash);
    const candidates=wasmGetConflicts();
    if(!Array.isArray(candidates))throw Error('원본 WASM 충돌 판정 구조를 확인할 수 없습니다');
    const eligible=candidates.filter(x=>x?.can_exchange===true&&
      Number.isInteger(Number(x.index))&&current.talents[Number(x.index)]);
    matched=eligible.find(x=>target==null||
      current.talents[Number(x.index)]?.id===target||
      current.talents[Number(x.earlier_index)]?.id===target)||null;
    if(matched){stopped='conflict';break;}
    if(i%25===24)await new Promise(resolve=>setTimeout(resolve,0));
   }
  }catch(error){
   wasmSetState(start);
   throw error;
  }
  const state=wasmGetState();
  send(requestId,true,{results:outcomes,state,found:!!matched,
    conflict:matched,performed:outcomes.length,limit,stopReason:stopped,
    targetId:target});
  return
 }
 if(op==='toggle-lock'){
  const index=Number(payload?.index);
  const state=wasmGetState();
  if(!Number.isInteger(index)||index<0||index>=4||
     !state||!Array.isArray(state.talents)||!state.talents[index])
   throw Error('잠금할 현재 재능 슬롯 번호를 확인하세요');
  const copy={...state,talents:state.talents.map(t=>({...t}))};
  const t=copy.talents[index],previous=!!t.locked;
  if(!previous&&copy.talents.filter(x=>x.locked).length>=3)
   throw Error('최대 3개의 재능만 잠글 수 있습니다');
  t.locked=!previous;
  if(!wasmSetState(copy))throw Error('WASM 잠금 상태 적용에 실패했습니다');
  const actual=wasmGetState();
  if(!actual||!!actual.talents?.[index]?.locked===previous){
   wasmSetState(state);
   throw Error('WASM에서 잠금 상태를 확인할 수 없습니다. 이전 상태로 복구했습니다');
  }
  send(requestId,true,{index,locked:!previous,state:actual});
  return
 }
 if(op==='exchange-talent'){
  const index=Number(payload?.index);
  const snapshot=wasmGetState();
  if(!Number.isInteger(index)||index<0||index>=4||!snapshot?.talents?.[index])
   throw Error('치환할 현재 재능 슬롯 번호를 확인하세요');
  if(snapshot.talents[index].locked)throw Error('잠긴 슬롯은 치환할 수 없습니다');
  const result=wasmExchangeTalent(index);
  if(!result||result.success!==true){
   wasmSetState(snapshot);
   throw Error('원본 WASM 치환 조건을 충족하지 못했습니다. 이전 상태로 복구했습니다');
  }
  const state=wasmGetState();
  if(!state||!Number.isFinite(Number(state.seed))){
   wasmSetState(snapshot);
   throw Error('치환 후 WASM 상태를 읽지 못해 이전 상태로 복구했습니다');
  }
  send(requestId,true,{index,result,state});
  return
 }
 if(op==='until-gold'){
  const limit=Number(payload?.count||1000);
  if(!Number.isInteger(limit)||limit<1||limit>5000)throw Error('자맥 자동 세수는 1–5000회 범위만 허용합니다');
  const results=wasmWashUntilGold(limit);
  send(requestId,true,{results:Array.isArray(results)?results:[],state:wasmGetState(),limit});
  return
 }
 if(op==='wash'){
  const count=Number(payload?.count??1);
  if(!Number.isInteger(count)||count<1||count>100)throw Error('모의 세수는 1–100회 정수로 실행하세요');
  const snapshot=wasmGetState();
  if(!snapshot)throw Error('WASM 모의 세수 시작 상태를 확인할 수 없습니다');
  const results=count===1?wasmDoWash():wasmWashMulti(count);
  const performed=Array.isArray(results)?results.length:results?1:0;
  const state=wasmGetState();
  if(!state||!Number.isFinite(Number(state.seed))){
   wasmSetState(snapshot);
   throw Error('모의 세수 후 상태를 확인할 수 없어 복구했습니다');
  }
  if(performed===0&&JSON.stringify(state)!==JSON.stringify(snapshot)){
   wasmSetState(snapshot);
   throw Error('모의 세수 실행 기록이 없어 이전 상태로 복구했습니다');
  }
  send(requestId,true,{results,state,requested:count,performed,
   partial:performed<count});
  return
 }
 throw Error('알 수 없는 명령');
}catch(err){send(requestId,false,{error:String(err.message||err)})}
});
</script></body></html>
